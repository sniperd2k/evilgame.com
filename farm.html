<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Mandy's Store - EVILGAME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    height: 100dvh;
    min-height: 100dvh;
    background: #0a0610;
    color: #c8f0c0;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
    padding:
      max(8px, env(safe-area-inset-top, 0px))
      max(8px, env(safe-area-inset-right, 0px))
      max(8px, env(safe-area-inset-bottom, 0px))
      max(8px, env(safe-area-inset-left, 0px));
  }
  .hud {
    width: min(720px, 96vw);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px 10px;
    font-size: clamp(7px, 2.1vw, 10px);
    line-height: 1.45;
    color: #7cff9a;
  }
  @media (max-width: 420px) {
    .hud { gap: 4px 8px; font-size: 7px; }
    .bar { gap: 6px; }
    a.back, button.reset { padding: 6px 8px; font-size: 7px; }
    #msg { min-height: 2.6em; font-size: 7px; }
    body { gap: 6px; }
  }
  .hud span { color: #c8f0c0; }
  .hud .nick {
    font: inherit;
    color: #ffe08a;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hud .nick:hover { color: #7cff9a; }
  .hud .nick:focus { outline: 1px dashed #7cff9a; outline-offset: 2px; }
  #wrap {
    position: relative;
    width: min(720px, 96vw);
    aspect-ratio: 4 / 3;
    max-height: min(70vh, 70dvh, 540px);
    border: 4px solid #3a3550;
    box-shadow: 0 0 0 4px #1a1528, 0 0 40px rgba(80, 255, 120, 0.12);
    background: #1a1410;
    flex: 0 1 auto;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas.dragging { cursor: grabbing; }
  #msg {
    width: min(720px, 96vw);
    min-height: 3.2em;
    font-size: clamp(8px, 2.2vw, 10px);
    line-height: 1.6;
    text-align: center;
    color: #ffe08a;
  }
  .bar {
    width: min(720px, 96vw);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  a.back, button.reset {
    font-family: inherit;
    font-size: 8px;
    color: #6a8870;
    text-decoration: none;
    background: transparent;
    border: 2px solid #3a3550;
    padding: 8px 10px;
    cursor: pointer;
  }
  a.back:hover, button.reset:hover { color: #7cff9a; border-color: #7cff9a; }
  #fanfare {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 20;
    background: rgba(0, 0, 0, 0.4);
  }
  #fanfare.on { display: flex; }
  #fanfare .burst {
    text-align: center;
    animation: crow-pop 3.5s ease-out forwards;
  }
  #fanfare .word {
    font-size: clamp(14px, 4.5vw, 22px);
    color: #ffe08a;
    text-shadow: 3px 3px 0 #1a0610, -2px -2px 0 #ff2d55;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  @keyframes crow-pop {
    0%   { transform: scale(0.4) rotate(-6deg); opacity: 0; }
    15%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
    70%  { transform: scale(1) rotate(0deg); opacity: 1; }
    100% { transform: scale(1.1) rotate(0deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="hud">
    <button type="button" class="nick" id="nick" title="Tap to rename">MANDY</button>
    <div>SCORE <span id="score">0</span></div>
    <div>HIGH <span id="high">0</span></div>
    <div>LVL <span id="lvl">1</span></div>
    <div>CATS <span id="cats">1</span></div>
  </div>
  <div id="wrap">
    <canvas id="c" width="640" height="480"></canvas>
    <div id="fanfare" aria-hidden="true"><div class="burst"><div class="word">RONNIE!!!<br>COCK-A-DOODLE-DOO</div></div></div>
  </div>
  <div id="msg">Drag Mandy. Shove 3 cats out the FRONT DOOR... then RUN from Ronnie!</div>
  <div class="bar">
    <a class="back" href="index.html">&lt;- PROGRAM MENU</a>
    <button type="button" class="reset" id="reset">RESET</button>
  </div>
<script>
(function () {
  var W = 640, H = 480;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var viewDpr = 1;

  function resizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (dpr < 1) dpr = 1;
    viewDpr = dpr;
    var bw = Math.round(W * dpr);
    var bh = Math.round(H * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var elNick = document.getElementById('nick');
  var elScore = document.getElementById('score');
  var elHigh = document.getElementById('high');
  var elLvl = document.getElementById('lvl');
  var elCats = document.getElementById('cats');
  var elMsg = document.getElementById('msg');
  var elFanfare = document.getElementById('fanfare');

  var STORE_KEY = 'evilgame.farm.v1';
  var NICK_ADJ = [
    'Barn', 'Hay', 'Crispy', 'Muddy', 'Spicy', 'Pixel', 'Cursed', 'Moist',
    'Dusty', 'Greasy', 'Chunky', 'Farm', 'Soggy', 'Forbidden', 'Clucky'
  ];
  var NICK_NOUN = [
    'Mandy', 'Goose', 'Pickle', 'Goblin', 'Nugget', 'Gremlin', 'Himbo',
    'Lord', 'Dumpling', 'Raccoon', 'Meatball', 'Wraith', 'Scooter', 'Hen'
  ];

  function sillyNick() {
    var a = NICK_ADJ[Math.floor(Math.random() * NICK_ADJ.length)];
    var n = NICK_NOUN[Math.floor(Math.random() * NICK_NOUN.length)];
    var num = 10 + Math.floor(Math.random() * 90);
    return a + n + num;
  }

  function defaultProfile() {
    return { nick: sillyNick(), highScore: 0 };
  }

  function loadProfile() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultProfile();
      var o = JSON.parse(raw);
      var out = defaultProfile();
      if (o && typeof o.nick === 'string' && o.nick.trim()) {
        out.nick = String(o.nick).trim().slice(0, 18);
      }
      if (o && typeof o.highScore === 'number' && isFinite(o.highScore) && o.highScore > 0) {
        out.highScore = Math.min(999999, Math.floor(o.highScore));
      }
      return out;
    } catch (e1) {
      return defaultProfile();
    }
  }

  function saveProfile() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        nick: profile.nick,
        highScore: profile.highScore
      }));
    } catch (e1) {}
  }

  var profile = loadProfile();
  saveProfile();

  // Front door on the RIGHT wall (clearly marked).
  var DOOR = { x: W - 22, y: H / 2 - 55, w: 18, h: 110, cx: W - 13, cy: H / 2 };
  var WALL = 18;
  var TOP_BAR = 36;

  var CAT_COLORS = [
    { body: '#e8a060', belly: '#f0d0a0', ear: '#d08050' },
    { body: '#c8c8d0', belly: '#f0f0f4', ear: '#a8a8b0' },
    { body: '#6a5040', belly: '#c8a888', ear: '#503828' },
    { body: '#f0e8a0', belly: '#fff8d0', ear: '#d0c070' },
    { body: '#9080a0', belly: '#d0c8d8', ear: '#706080' }
  ];

  var EXIT_LINES = [
    'SCOOT, KITTY!',
    'OUT YOU GO!',
    'FRONT DOOR SERVICE!',
    'NO LOITERING IN THE STORE!',
    'SHIP THE CAT!',
    'MANDY CLEARS THE AISLE!'
  ];

  var state = {
    score: 0,
    level: 1,
    catsNeeded: 1,
    cats: [],
    player: { x: W * 0.35, y: H / 2, r: 16, hasBroom: false, stuckT: 0 },
    dragging: false,
    dragOff: { x: 0, y: 0 },
    recenterDrag: false,
    // play | ronnie_intro | ronnie_chase | ronnie_bounce | mandy_return | broom_chase | soft_reset
    mode: 'play',
    modeT: 0,
    ronnie: null,
    lastRonnieAt: 0,
    _dt: 1 / 60,
    shelves: [],
    shelfSlide: false
  };

  function say(text) {
    elMsg.textContent = text;
  }

  function dist(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function bumpHighIfNeeded() {
    if (state.score > profile.highScore) {
      profile.highScore = state.score;
      saveProfile();
    }
  }

  function hud() {
    elNick.textContent = profile.nick;
    elScore.textContent = String(state.score);
    elHigh.textContent = String(profile.highScore);
    elLvl.textContent = String(state.level);
    elCats.textContent = String(state.catsNeeded);
  }

  function renameNick() {
    var cur = profile.nick;
    var next = window.prompt('New silly nickname (score stays):', cur);
    if (next == null) return;
    next = String(next).trim().replace(/\s+/g, ' ').slice(0, 18);
    if (!next) return;
    profile.nick = next;
    saveProfile();
    hud();
    say(profile.nick + ' RUNS THE STORE.');
  }

  var SHELF_LABELS = [
    'FEED', 'HAY', 'EGGS', 'MILK', 'SEED', 'JAM', 'CORN', 'SOAP',
    'NAILS', 'BITS', 'WOOL', 'BEANS', 'PICKLE', 'FLOUR', 'OATS'
  ];
  var OBSTACLE_KINDS = ['shelf', 'crate', 'barrel', 'cart', 'stack'];

  function randRange(a, b) {
    return a + Math.random() * (b - a);
  }

  function rectsOverlap(a, b, pad) {
    pad = pad || 0;
    return !(a.x + a.w + pad < b.x || b.x + b.w + pad < a.x ||
             a.y + a.h + pad < b.y || b.y + b.h + pad < a.y);
  }

  function doorKeepClear(s) {
    // Keep a clear corridor to the front door + Mandy spawn zone
    var doorZone = { x: W - 130, y: DOOR.y - 30, w: 130, h: DOOR.h + 60 };
    var spawnZone = { x: W * 0.22, y: H / 2 - 50, w: 90, h: 100 };
    return !rectsOverlap(s, doorZone, 4) && !rectsOverlap(s, spawnZone, 4);
  }

  function makeObstacle(kind, x, y, label) {
    var w, h;
    if (kind === 'crate') { w = 34 + Math.floor(Math.random() * 18); h = 30 + Math.floor(Math.random() * 16); }
    else if (kind === 'barrel') { w = 28 + Math.floor(Math.random() * 10); h = 36 + Math.floor(Math.random() * 14); }
    else if (kind === 'cart') { w = 55 + Math.floor(Math.random() * 25); h = 28 + Math.floor(Math.random() * 12); }
    else if (kind === 'stack') { w = 26 + Math.floor(Math.random() * 14); h = 48 + Math.floor(Math.random() * 28); }
    else { w = 50 + Math.floor(Math.random() * 40); h = 28 + Math.floor(Math.random() * 20); }
    return {
      x: x, y: y, w: w, h: h,
      label: label || '',
      kind: kind,
      tx: x, ty: y,
      vx: 0, vy: 0,
      sliding: false
    };
  }

  function buildShelves(forcePattern) {
    // Random varied aisle layouts each round (shapes/sizes/types).
    var pattern = forcePattern != null ? forcePattern : Math.floor(Math.random() * 5);
    var shelves = [];
    var labels = SHELF_LABELS.slice();
    function nextLabel() {
      if (!labels.length) labels = SHELF_LABELS.slice();
      var i = Math.floor(Math.random() * labels.length);
      return labels.splice(i, 1)[0];
    }
    function tryPlace(kind, x, y, label, pad) {
      var s = makeObstacle(kind, Math.round(x), Math.round(y), label);
      if (s.x < WALL + 8) s.x = WALL + 8;
      if (s.y < TOP_BAR + 8) s.y = TOP_BAR + 8;
      if (s.x + s.w > W - WALL - 20) s.x = W - WALL - 20 - s.w;
      if (s.y + s.h > H - WALL - 8) s.y = H - WALL - 8 - s.h;
      if (!doorKeepClear(s)) return false;
      for (var i = 0; i < shelves.length; i++) {
        if (rectsOverlap(s, shelves[i], pad == null ? 14 : pad)) return false;
      }
      shelves.push(s);
      return true;
    }

    var attempts, i, kind, x, y;
    if (pattern === 0) {
      // Twin aisle rows
      for (i = 0; i < 3; i++) {
        tryPlace('shelf', 80 + i * 130, 88, nextLabel());
        tryPlace('shelf', 80 + i * 130, H - 105, nextLabel());
      }
      tryPlace('stack', 470, 155, '');
      tryPlace('barrel', 490, 300, '');
    } else if (pattern === 1) {
      // Diagonal gauntlet
      tryPlace('crate', 70, 100, nextLabel());
      tryPlace('shelf', 180, 160, nextLabel());
      tryPlace('barrel', 300, 220, '');
      tryPlace('cart', 120, 320, nextLabel());
      tryPlace('stack', 400, 100, '');
      tryPlace('shelf', 360, 340, nextLabel());
      tryPlace('crate', 250, 90, nextLabel());
    } else if (pattern === 2) {
      // Clustered market stalls + tall stacks
      tryPlace('shelf', 70, 90, nextLabel());
      tryPlace('shelf', 160, 90, nextLabel());
      tryPlace('cart', 70, H - 110, nextLabel());
      tryPlace('barrel', 200, H - 120, '');
      tryPlace('barrel', 250, H - 115, '');
      tryPlace('stack', 420, 140, '');
      tryPlace('stack', 460, 250, '');
      tryPlace('crate', 320, 200, nextLabel());
    } else if (pattern === 3) {
      // Wide center island + side crates
      tryPlace('shelf', 200, H / 2 - 40, nextLabel(), 10);
      tryPlace('shelf', 280, H / 2 - 40, nextLabel(), 10);
      tryPlace('crate', 70, 100, nextLabel());
      tryPlace('crate', 70, H - 120, nextLabel());
      tryPlace('cart', 400, 100, nextLabel());
      tryPlace('barrel', 430, 320, '');
      tryPlace('stack', 140, 220, '');
    } else {
      // Scatter chaos (still navigable)
      for (attempts = 0; attempts < 80 && shelves.length < 8; attempts++) {
        kind = OBSTACLE_KINDS[Math.floor(Math.random() * OBSTACLE_KINDS.length)];
        x = randRange(60, W - 200);
        y = randRange(TOP_BAR + 30, H - 90);
        tryPlace(kind, x, y, kind === 'shelf' || kind === 'crate' || kind === 'cart' ? nextLabel() : '');
      }
    }
    // Guarantee at least a few props
    while (shelves.length < 5) {
      kind = OBSTACLE_KINDS[shelves.length % OBSTACLE_KINDS.length];
      x = 80 + shelves.length * 70;
      y = (shelves.length % 2 === 0) ? 100 : H - 110;
      tryPlace(kind, x, y, nextLabel()) || shelves.push(makeObstacle(kind, x, y, nextLabel()));
    }
    state.shelves = shelves;
    state.shelfSlide = false;
  }

  function assignShelfShuffleTargets() {
    // Pick new free targets so Ronnie's bounce-pass reshuffles the floor for next round.
    var used = [];
    var i, s, tries, nx, ny, candidate, ok, j;
    for (i = 0; i < state.shelves.length; i++) {
      s = state.shelves[i];
      ok = false;
      for (tries = 0; tries < 60; tries++) {
        nx = randRange(WALL + 10, W - 160 - s.w);
        ny = randRange(TOP_BAR + 16, H - WALL - 16 - s.h);
        candidate = { x: nx, y: ny, w: s.w, h: s.h };
        if (!doorKeepClear(candidate)) continue;
        ok = true;
        for (j = 0; j < used.length; j++) {
          if (rectsOverlap(candidate, used[j], 12)) { ok = false; break; }
        }
        if (ok) {
          s.tx = Math.round(nx);
          s.ty = Math.round(ny);
          s.sliding = true;
          s.vx = (s.tx - s.x) * 0.08;
          s.vy = (s.ty - s.y) * 0.08;
          used.push({ x: s.tx, y: s.ty, w: s.w, h: s.h });
          break;
        }
      }
      if (!ok) {
        // Fallback: nudge from current spot
        s.tx = Math.max(WALL + 10, Math.min(W - 160 - s.w, s.x + randRange(-80, 80)));
        s.ty = Math.max(TOP_BAR + 16, Math.min(H - WALL - 16 - s.h, s.y + randRange(-70, 70)));
        s.sliding = true;
        used.push({ x: s.tx, y: s.ty, w: s.w, h: s.h });
      }
    }
    state.shelfSlide = true;
  }

  function updateShelfSlide(dt) {
    if (!state.shelfSlide) return;
    var i, s, dx, dy, d, step, allDone = true;
    var spd = 4.2 * (dt * 60);
    for (i = 0; i < state.shelves.length; i++) {
      s = state.shelves[i];
      if (!s.sliding) continue;
      dx = s.tx - s.x;
      dy = s.ty - s.y;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < 2.5) {
        s.x = s.tx;
        s.y = s.ty;
        s.sliding = false;
        s.vx = 0;
        s.vy = 0;
      } else {
        allDone = false;
        step = Math.min(spd, d);
        s.x += (dx / d) * step;
        s.y += (dy / d) * step;
        // Little bounce wobble while sliding
        s.y += Math.sin((state.modeT + i) * 18) * 0.6;
      }
    }
    if (allDone) state.shelfSlide = false;
  }

  function freeSpotNear(x, y, r, avoidDoor) {
    // Spiral search for a non-overlapping spot (unstick helper).
    var ang, rad, nx, ny, i, s, cx, cy, dx, dy, hits, k;
    for (k = 0; k < 36; k++) {
      ang = k * 0.7;
      rad = 12 + k * 7;
      nx = x + Math.cos(ang) * rad;
      ny = y + Math.sin(ang) * rad;
      nx = Math.max(WALL + r + 2, Math.min(W - WALL - r - 8, nx));
      ny = Math.max(TOP_BAR + r + 2, Math.min(H - WALL - r - 2, ny));
      if (avoidDoor && dist(nx, ny, DOOR.cx, DOOR.cy) < 70) continue;
      hits = false;
      for (i = 0; i < state.shelves.length; i++) {
        s = state.shelves[i];
        cx = Math.max(s.x, Math.min(nx, s.x + s.w));
        cy = Math.max(s.y, Math.min(ny, s.y + s.h));
        dx = nx - cx; dy = ny - cy;
        if (dx * dx + dy * dy < (r + 2) * (r + 2)) { hits = true; break; }
      }
      if (!hits) return { x: nx, y: ny };
    }
    return { x: W * 0.32, y: H / 2 };
  }

  function entityDeeplyStuck(ent) {
    var i, s, cx, cy, dx, dy, d2, r = ent.r;
    for (i = 0; i < state.shelves.length; i++) {
      s = state.shelves[i];
      // Center inside rect = deeply stuck
      if (ent.x > s.x + 2 && ent.x < s.x + s.w - 2 &&
          ent.y > s.y + 2 && ent.y < s.y + s.h - 2) return true;
      cx = Math.max(s.x, Math.min(ent.x, s.x + s.w));
      cy = Math.max(s.y, Math.min(ent.y, s.y + s.h));
      dx = ent.x - cx; dy = ent.y - cy;
      d2 = dx * dx + dy * dy;
      if (d2 < (r * 0.35) * (r * 0.35)) return true;
    }
    return false;
  }

  function unstickSafeguards(dt) {
    // CRITICAL: Mandy / cats must never stay stuck in obstacles.
    var p = state.player;
    var spot, i, cat, moved;
    if (state.mode === 'play') {
      if (entityDeeplyStuck(p)) {
        p.stuckT = (p.stuckT || 0) + dt;
        if (p.stuckT > 0.12) {
          spot = freeSpotNear(p.x, p.y, p.r, false);
          p.x = spot.x; p.y = spot.y;
          p.stuckT = 0;
          state.recenterDrag = true;
        }
      } else {
        p.stuckT = 0;
      }
    }
    for (i = 0; i < state.cats.length; i++) {
      cat = state.cats[i];
      if (cat.exiting) continue;
      if (entityDeeplyStuck(cat)) {
        cat.stuckT = (cat.stuckT || 0) + dt;
        if (cat.stuckT > 0.18) {
          spot = freeSpotNear(cat.x, cat.y, cat.r, true);
          cat.x = spot.x; cat.y = spot.y;
          cat.vx = (Math.random() - 0.5) * 2;
          cat.vy = (Math.random() - 0.5) * 2;
          cat.stuckT = 0;
        }
      } else {
        cat.stuckT = 0;
      }
      // Velocity-dead + overlapping edge: kick
      if (!cat.exiting && Math.abs(cat.vx) < 0.05 && Math.abs(cat.vy) < 0.05) {
        moved = false;
        // lightly nudge if barely overlapping after clamp
        if (entityDeeplyStuck(cat)) {
          spot = freeSpotNear(cat.x, cat.y, cat.r, true);
          cat.x = spot.x; cat.y = spot.y;
          cat.vx = 1.2; cat.vy = (Math.random() - 0.5);
          moved = true;
        }
        if (!moved) cat.idleStuck = (cat.idleStuck || 0) + dt;
        else cat.idleStuck = 0;
        if ((cat.idleStuck || 0) > 2.5) {
          cat.vx = (Math.random() - 0.5) * 3;
          cat.vy = (Math.random() - 0.5) * 3;
          cat.idleStuck = 0;
        }
      } else {
        cat.idleStuck = 0;
      }
    }
  }

  function spawnCats(n) {
    var cats = [];
    var tries = 0;
    while (cats.length < n && tries < 200) {
      tries += 1;

      cat.x += cat.vx * (dt * 60);
      cat.y += cat.vy * (dt * 60);

      if (state.mode === 'play') pushCat(cat);

      result = clampEntity(cat);
      if (result === 'exit') {
        catExited(cat);
        alive.push(cat);
      } else if (cat.x > W - 8 && cat.y > DOOR.y + 4 && cat.y < DOOR.y + DOOR.h - 4) {
        catExited(cat);
        alive.push(cat);
      } else {
        alive.push(cat);
      }
    }
    state.cats = alive;

    if (state.mode === 'play') {
      var remaining = 0;
      for (i = 0; i < state.cats.length; i++) {
        if (!state.cats[i].exiting) remaining += 1;
      }
      if (remaining === 0 && state.cats.length === 0) {
        // All cleared (exiting ones already removed)
        levelCleared();
      } else if (remaining === 0) {
        // Wait for exit anims then clear
        var allGone = true;
        for (i = 0; i < state.cats.length; i++) {
          if (!state.cats[i].exiting) allGone = false;
        }
        if (allGone && state.cats.every(function (c) { return c.exitT > 0.4; })) {
          levelCleared();
        }
      }
    }
  }

  function tickRonnieCrow(r, dt) {
    // Re-crow throughout intro + chase (not just once at spawn)
    if (r.crowCd == null) r.crowCd = 0;
    r.crowCd -= dt;
    if (r.crowCd <= 0) {
      playCockadoodle();
      r.crowCd = 1.05 + Math.random() * 0.25;
    }
  }

  function bounceRonnieOffShelves(r) {
    // Physical bounce-pass: Ronnie knocks every shelf toward its shuffle target.
    var i, s, cx, cy, dx, dy, d, overlap;
    for (i = 0; i < state.shelves.length; i++) {
      s = state.shelves[i];
      cx = s.x + s.w / 2;
      cy = s.y + s.h / 2;
      dx = cx - r.x;
      dy = cy - r.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1;
      overlap = (r.r + Math.max(s.w, s.h) * 0.35) - d;
      if (overlap > 0) {
        // Impart slide toward assigned target (or away from Ronnie)
        s.sliding = true;
        state.shelfSlide = true;
        if (s.tx == null) { s.tx = s.x; s.ty = s.y; }
        s.x += (dx / d) * Math.min(8, overlap + 2);
        s.y += (dy / d) * Math.min(8, overlap + 2);
        // Reflect Ronnie a bit so he keeps ping-ponging
        r.x -= (dx / d) * 4;
        r.y -= (dy / d) * 4;
        if (r.bounceCd <= 0) {
          r.bounceI = ((r.bounceI || 0) + 1) % Math.max(1, state.shelves.length);
          r.bounceCd = 0.12;
        }
      }
    }
  }

  function updateRonnie(dt) {
    var r = state.ronnie;
    var p = state.player;
    var dx, dy, d, target, sx, sy, wp, nShelves, hitsNeeded;
    state.modeT += dt;
    updateShelfSlide(dt);

    if (r) tickRonnieCrow(r, dt);

    if (state.mode === 'ronnie_intro') {
      // Burst IN through the front door (right), dash toward Mandy (~3.4s)
      var inX = Math.min(p.x + 40, W * 0.62);
      var inY = p.y;
      dx = inX - r.x;
      dy = inY - r.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1;
      r.x += (dx / d) * 2.15 * (dt * 60);
      r.y += (dy / d) * 2.15 * (dt * 60);
      r.y += Math.sin(state.modeT * 10) * 1.5;
      // Don't early-out on proximity alone — stretch the entrance beat
      if (state.modeT > 3.5 || (state.modeT > 3.2 && dist(r.x, r.y, p.x, p.y) < 48)) {
        state.mode = 'ronnie_chase';
        state.modeT = 0;
        if (r) {
          r.chaseWp = 0;
          // 2–3 near-miss loops: left / back / toward door, then exit sticks
          r.chaseWaypoints = [
            { x: W * 0.18, y: H * 0.30, exit: false, line: 'LEFT AISLE! RUN!' },
            { x: W * 0.22, y: H * 0.78, exit: false, line: 'BACK OF THE STORE!' },
            { x: W * 0.70, y: DOOR.cy, exit: false, line: 'ALMOST OUT — MISS!' },
            { x: W * 0.16, y: H * 0.48, exit: false, line: 'HERDED LEFT AGAIN!' },
            { x: W * 0.74, y: DOOR.cy, exit: false, line: 'DOOR NEAR-MISS!' },
            { x: DOOR.cx + 18, y: DOOR.cy, exit: true, line: 'OUT THE FRONT DOOR!' }
          ];
        }
        say('RONNIE CHASES MANDY AROUND THE STORE!');
      }
      return;
    }

    if (state.mode === 'ronnie_chase') {
      // Herd Mandy: left/back/toward-door near-misses (~7–8s) before exit sticks
      if (!r.chaseWaypoints) {
        r.chaseWp = 0;
        r.chaseWaypoints = [
          { x: W * 0.18, y: H * 0.30, exit: false },
          { x: W * 0.22, y: H * 0.78, exit: false },
          { x: W * 0.70, y: DOOR.cy, exit: false },
          { x: W * 0.16, y: H * 0.48, exit: false },
          { x: W * 0.74, y: DOOR.cy, exit: false },
          { x: DOOR.cx + 18, y: DOOR.cy, exit: true }
        ];
      }
      if (r.chaseWp == null) r.chaseWp = 0;
      if (r.chaseWp >= r.chaseWaypoints.length) r.chaseWp = r.chaseWaypoints.length - 1;
      wp = r.chaseWaypoints[r.chaseWp];
      p.x += (wp.x - p.x) * Math.min(1, dt * 1.55);
      p.y += (wp.y - p.y) * Math.min(1, dt * 1.55);
      // Cap X so near-miss approaches never accidentally exit early
      if (!wp.exit) p.x = Math.min(p.x, W - 72);
      dx = p.x - r.x;
      dy = p.y - r.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1;
      r.x += (dx / d) * 3.8 * (dt * 60);
      r.y += (dy / d) * 3.8 * (dt * 60);
      r.y += Math.sin(state.modeT * 14) * 1.2;

      if (dist(p.x, p.y, wp.x, wp.y) < 26) {
        if (wp.line) say(wp.line);
        if (wp.exit) {
          p.x = W + 40;
        } else {
          r.chaseWp += 1;
        }
      }

      // Hard timeout forces the exit stick (~7.8s chase target)
      if ((wp.exit && p.x > W - 40) || state.modeT > 7.8) {
        // Mandy is out — Ronnie bounce-pass reshuffles EVERY obstacle
        p.x = W + 40;
        assignShelfShuffleTargets();
        r.bounceI = 0;
        r.bounceCd = 0;
        r.bounceHits = 0;
        state.mode = 'ronnie_bounce';
        state.modeT = 0;
        say('RONNIE BOUNCE-PASS! AISLES GO FLYING!');
      }
      return;
    }

    if (state.mode === 'ronnie_bounce') {
      if (r.bounceCd > 0) r.bounceCd -= dt;
      if (r.bounceHits == null) r.bounceHits = 0;
      nShelves = state.shelves.length;
      hitsNeeded = Math.max(1, nShelves * 2); // thorough: hit every shelf twice
      // Zip between shelf centers, physically sliding them to new spots
      if (nShelves) {
        target = state.shelves[r.bounceI % nShelves];
        sx = target.x + target.w / 2;
        sy = target.y + target.h / 2;
        dx = sx - r.x;
        dy = sy - r.y;
        d = Math.sqrt(dx * dx + dy * dy) || 1;
        r.x += (dx / d) * 4.0 * (dt * 60);
        r.y += (dy / d) * 4.0 * (dt * 60);
        r.y += Math.sin(state.modeT * 16) * 2;
        bounceRonnieOffShelves(r);
        if (d < 28 && r.bounceCd <= 0) {
          r.bounceI = (r.bounceI + 1) % nShelves;
          r.bounceHits += 1;
          r.bounceCd = 0.10;
        }
      }
      // After two full pinball passes (or ~7.2s timeout), Mandy returns with broom
      if (state.modeT > 7.4 || (r.bounceHits >= hitsNeeded && !state.shelfSlide && state.modeT > 5.2)) {
        // Snap remaining shelves to targets
        var i, s;
        for (i = 0; i < state.shelves.length; i++) {
          s = state.shelves[i];
          s.x = s.tx; s.y = s.ty; s.sliding = false;
        }
        state.shelfSlide = false;
        state.mode = 'mandy_return';
        state.modeT = 0;
        p.x = DOOR.cx + 20;
        p.y = DOOR.cy;
        p.hasBroom = true;
        say('MANDY RETURNS... WITH A BROOM!');
      }
      return;
    }

    if (state.mode === 'mandy_return') {
      // Mandy marches back in with broom; Ronnie freezes mid-crow (~3.3s)
      var homeX = W * 0.45;
      var homeY = H / 2;
      p.x += (homeX - p.x) * Math.min(1, dt * 0.95);
      p.y += (homeY - p.y) * Math.min(1, dt * 0.95);
      if (r) {
        r.y += Math.sin(state.modeT * 10) * 0.8;
      }
      if (state.modeT > 3.4 || (state.modeT > 3.0 && dist(p.x, p.y, homeX, homeY) < 14)) {
        state.mode = 'broom_chase';
        state.modeT = 0;
        say('SHOO, RONNIE! BROOM BEATS ROOSTER!');
      }
      return;
    }

    if (state.mode === 'broom_chase') {
      // Mandy shuffles Ronnie out the front door with the broom (~6.9s)
      if (!r) {
        state.mode = 'soft_reset';
        state.modeT = 0;
        return;
      }
      // Zigzag herd: hold Ronnie in-store until the broom finale has played out
      var phase = Math.min(1, state.modeT / 6.2);
      var zig = Math.sin(state.modeT * 2.2) * (1 - phase) * 90;
      var outX = (W * 0.35) * (1 - phase) + (DOOR.cx + 30) * phase + zig;
      var outY = DOOR.cy + Math.sin(state.modeT * 3.1) * 40 * (1 - phase);
      // Mandy stays behind Ronnie, poking
      var behindX = r.x - 36;
      var behindY = r.y;
      p.x += (behindX - p.x) * Math.min(1, dt * 1.15);
      p.y += (behindY - p.y) * Math.min(1, dt * 1.15);
      dx = outX - r.x;
      dy = outY - r.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1;
      r.x += (dx / d) * 2.4 * (dt * 60);
      r.y += (dy / d) * 2.4 * (dt * 60);
      r.y += Math.sin(state.modeT * 20) * 1.5;
      // Broom poke impulse
      if (dist(p.x, p.y, r.x, r.y) < 50) {
        r.x += (dx / d) * 0.9;
      }
      // Exit only after the stretched broom beat (or hard timeout)
      if ((r.x > W - 20 && state.modeT > 6.5) || state.modeT > 6.9) {
        state.ronnie = null;
        state.mode = 'soft_reset';
        state.modeT = 0;
      }
      return;
    }

    if (state.mode === 'soft_reset') {
      softResetKeepScore();
      // Belt-and-suspenders: cinema is over, input must work again
      restorePlayControl();
      state.mode = 'play';
    }
  }

  function update(dt) {
    applyWasdMove();
    if (state.mode === 'play') {
      updateCats(dt);
      unstickSafeguards(dt);
      // Ronnie triggers every 3 cats (maybeTriggerRonnie from catExited)
    } else {
      // Cats may still drift / exit during cinema
      updateCats(dt);
      updateRonnie(dt);
      unstickSafeguards(dt);
    }
  }

  // --- Draw ---
  function drawStore() {
    // Floor boards
    ctx.fillStyle = '#3a2a1c';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#2a1e14';
    ctx.lineWidth = 2;
    var y;
    for (y = TOP_BAR; y < H; y += 22) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    // Wood plank grain hints
    ctx.strokeStyle = '#4a3828';
    ctx.lineWidth = 1;
    for (y = TOP_BAR + 8; y < H; y += 44) {
      ctx.beginPath();
      ctx.moveTo(20, y);
      ctx.lineTo(W - 40, y);
      ctx.stroke();
    }

    // Ceiling / header bar
    ctx.fillStyle = '#1a120c';
    ctx.fillRect(0, 0, W, TOP_BAR);
    ctx.fillStyle = '#7cff9a';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText("MANDY'S STORE", 14, 24);

    // Walls
    ctx.strokeStyle = '#5a4838';
    ctx.lineWidth = 8;
    ctx.strokeRect(WALL / 2, TOP_BAR + 2, W - WALL, H - TOP_BAR - WALL / 2);

    // Window on left
    ctx.fillStyle = '#203848';
    ctx.fillRect(28, 140, 36, 50);
    ctx.strokeStyle = '#8ab0c8';
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 140, 36, 50);
    ctx.beginPath();
    ctx.moveTo(46, 140);
    ctx.lineTo(46, 190);
    ctx.moveTo(28, 165);
    ctx.lineTo(64, 165);
    ctx.stroke();
    // Light spill
    ctx.fillStyle = 'rgba(160, 200, 220, 0.08)';
    ctx.fillRect(64, 140, 50, 70);

    // Obstacles (shelves / crates / barrels / carts / stacks)
    var i, s, kind;
    for (i = 0; i < state.shelves.length; i++) {
      s = state.shelves[i];
      kind = s.kind || 'shelf';
      if (kind === 'barrel') {
        ctx.fillStyle = '#8a5030';
        ctx.beginPath();
        ctx.ellipse(s.x + s.w / 2, s.y + s.h / 2, s.w / 2, s.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2a1a10';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = '#c08050';
        ctx.beginPath();
        ctx.moveTo(s.x + 4, s.y + s.h * 0.3);
        ctx.lineTo(s.x + s.w - 4, s.y + s.h * 0.3);
        ctx.moveTo(s.x + 4, s.y + s.h * 0.7);
        ctx.lineTo(s.x + s.w - 4, s.y + s.h * 0.7);
        ctx.stroke();
      } else if (kind === 'crate') {
        ctx.fillStyle = '#a07040';
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.strokeStyle = '#3a2818';
        ctx.lineWidth = 2;
        ctx.strokeRect(s.x, s.y, s.w, s.h);
        ctx.beginPath();
        ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.w, s.y + s.h);
        ctx.moveTo(s.x + s.w, s.y); ctx.lineTo(s.x, s.y + s.h);
        ctx.stroke();
      } else if (kind === 'cart') {
        ctx.fillStyle = '#6a5840';
        ctx.fillRect(s.x, s.y + 6, s.w, s.h - 10);
        ctx.fillStyle = '#8a7858';
        ctx.fillRect(s.x + 4, s.y, s.w - 8, 10);
        ctx.fillStyle = '#2a2a2a';
        ctx.beginPath();
        ctx.arc(s.x + 10, s.y + s.h - 2, 5, 0, Math.PI * 2);
        ctx.arc(s.x + s.w - 10, s.y + s.h - 2, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === 'stack') {
        ctx.fillStyle = '#b09060';
        ctx.fillRect(s.x + 2, s.y + s.h * 0.55, s.w - 4, s.h * 0.4);
        ctx.fillStyle = '#c0a070';
        ctx.fillRect(s.x, s.y + s.h * 0.28, s.w, s.h * 0.3);
        ctx.fillStyle = '#d0b080';
        ctx.fillRect(s.x + 4, s.y, s.w - 8, s.h * 0.3);
        ctx.strokeStyle = '#3a2818';
        ctx.lineWidth = 2;
        ctx.strokeRect(s.x, s.y, s.w, s.h);
      } else {
        ctx.fillStyle = '#6a4830';
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = '#8a6848';
        ctx.fillRect(s.x, s.y, s.w, 8);
        ctx.strokeStyle = '#2a1a10';
        ctx.lineWidth = 2;
        ctx.strokeRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = '#c05040';
        ctx.fillRect(s.x + 8, s.y + 14, 10, 14);
        ctx.fillStyle = '#e8c060';
        ctx.fillRect(s.x + 24, s.y + 16, 12, 12);
        ctx.fillStyle = '#5080c0';
        if (s.w > 48) ctx.fillRect(s.x + 42, s.y + 14, 10, 14);
      }
      // Motion streaks while sliding
      if (s.sliding) {
        ctx.strokeStyle = 'rgba(255, 224, 138, 0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x - 6, s.y + s.h / 2);
        ctx.lineTo(s.x + 4, s.y + s.h / 2 - 4);
        ctx.moveTo(s.x - 6, s.y + s.h / 2);
        ctx.lineTo(s.x + 4, s.y + s.h / 2 + 4);
        ctx.stroke();
      }
      if (s.label) {
        ctx.fillStyle = '#ffe08a';
        ctx.font = '6px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText(s.label, s.x + s.w / 2, s.y - 4);
        ctx.textAlign = 'left';
      }
    }

    // Front door (RIGHT wall) - always visible
    drawDoor();
  }

  function drawDoor() {
    var d = DOOR;
    // Door frame
    ctx.fillStyle = '#2a4a20';
    ctx.fillRect(d.x - 6, d.y - 8, d.w + 12, d.h + 16);
    // Door opening (bright outside)
    ctx.fillStyle = '#7ec8ff';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    // Sun stripes
    ctx.fillStyle = '#ffe08a';
    ctx.fillRect(d.x + 2, d.y + 10, d.w - 4, 6);
    ctx.fillRect(d.x + 2, d.y + 40, d.w - 4, 6);
    ctx.fillRect(d.x + 2, d.y + 70, d.w - 4, 6);
    ctx.strokeStyle = '#7cff9a';
    ctx.lineWidth = 3;
    ctx.strokeRect(d.x - 4, d.y - 6, d.w + 8, d.h + 12);

    // Label
    ctx.save();
    ctx.translate(d.x - 18, d.cy);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#ffe08a';
    ctx.font = '8px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('FRONT DOOR', 0, 0);
    ctx.restore();

    // Arrow pointing out
    ctx.fillStyle = '#7cff9a';
    ctx.beginPath();
    ctx.moveTo(d.x - 28, d.cy - 8);
    ctx.lineTo(d.x - 10, d.cy);
    ctx.lineTo(d.x - 28, d.cy + 8);
    ctx.closePath();
    ctx.fill();
  }

  function drawCat(cat) {
    var x = cat.x, y = cat.y;
    var bob = Math.sin(cat.wobble) * 1.5;
    var col = cat.color;
    ctx.save();
    if (cat.exiting) {
      ctx.globalAlpha = Math.max(0, 1 - cat.exitT * 2);
    }
    // Body
    ctx.fillStyle = col.body;
    ctx.beginPath();
    ctx.ellipse(x, y + bob, cat.r * 1.1, cat.r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    // Belly
    ctx.fillStyle = col.belly;
    ctx.beginPath();
    ctx.ellipse(x, y + bob + 2, cat.r * 0.55, cat.r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    // Head
    ctx.fillStyle = col.body;
    ctx.beginPath();
    ctx.arc(x + cat.r * 0.55, y + bob - cat.r * 0.35, cat.r * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // Ears
    ctx.fillStyle = col.ear;
    ctx.beginPath();
    ctx.moveTo(x + cat.r * 0.2, y + bob - cat.r * 0.7);
    ctx.lineTo(x + cat.r * 0.35, y + bob - cat.r * 1.25);
    ctx.lineTo(x + cat.r * 0.55, y + bob - cat.r * 0.65);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + cat.r * 0.7, y + bob - cat.r * 0.65);
    ctx.lineTo(x + cat.r * 0.95, y + bob - cat.r * 1.2);
    ctx.lineTo(x + cat.r * 1.05, y + bob - cat.r * 0.55);
    ctx.closePath();
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#1a0610';
    ctx.beginPath();
    ctx.arc(x + cat.r * 0.45, y + bob - cat.r * 0.4, 1.6, 0, Math.PI * 2);
    ctx.arc(x + cat.r * 0.75, y + bob - cat.r * 0.4, 1.6, 0, Math.PI * 2);
    ctx.fill();
    // Tail
    ctx.strokeStyle = col.body;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - cat.r * 0.9, y + bob);
    ctx.quadraticCurveTo(
      x - cat.r * 1.6,
      y + bob - 10 - Math.sin(cat.wobble * 1.3) * 4,
      x - cat.r * 1.2,
      y + bob - 16
    );
    ctx.stroke();
    ctx.restore();
  }

  function drawMandy() {
    var p = state.player;
    if (p.x > W + 10) return; // offstage during bounce-pass
    var scared = state.mode === 'ronnie_chase' || state.mode === 'ronnie_intro';
    var determined = state.mode === 'mandy_return' || state.mode === 'broom_chase';
    // Boots
    ctx.fillStyle = '#4a3020';
    ctx.fillRect(p.x - 10, p.y + 10, 8, 6);
    ctx.fillRect(p.x + 2, p.y + 10, 8, 6);
    // Overalls
    ctx.fillStyle = '#3a6a9a';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 2, 11, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    // Shirt
    ctx.fillStyle = '#e8b070';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y - 6, 9, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // Head
    ctx.fillStyle = '#f0c8a8';
    ctx.beginPath();
    ctx.arc(p.x, p.y - 16, 10, 0, Math.PI * 2);
    ctx.fill();
    // Hair
    ctx.fillStyle = '#5a3820';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y - 22, 10, 6, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#1a0610';
    if (scared) {
      ctx.beginPath();
      ctx.arc(p.x - 3.5, p.y - 17, 2.2, 0, Math.PI * 2);
      ctx.arc(p.x + 3.5, p.y - 17, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x - 3, p.y - 17.5, 0.8, 0, Math.PI * 2);
      ctx.arc(p.x + 4, p.y - 17.5, 0.8, 0, Math.PI * 2);
      ctx.fill();
    } else if (determined) {
      // Determined squint
      ctx.fillRect(p.x - 5, p.y - 17.5, 4, 2);
      ctx.fillRect(p.x + 1.5, p.y - 17.5, 4, 2);
    } else {
      ctx.beginPath();
      ctx.arc(p.x - 3.5, p.y - 17, 1.5, 0, Math.PI * 2);
      ctx.arc(p.x + 3.5, p.y - 17, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // Smile / O mouth / grit
    ctx.strokeStyle = '#1a0610';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (scared) {
      ctx.arc(p.x, p.y - 12, 2.5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (determined) {
      ctx.moveTo(p.x - 3, p.y - 12);
      ctx.lineTo(p.x + 3, p.y - 12);
      ctx.stroke();
    } else {
      ctx.arc(p.x, p.y - 13, 3.5, 0.15, Math.PI - 0.15);
      ctx.stroke();
    }
    // Broom (return / chase)
    if (p.hasBroom) {
      ctx.strokeStyle = '#8a6030';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x + 8, p.y - 8);
      ctx.lineTo(p.x + 28, p.y + 18);
      ctx.stroke();
      ctx.fillStyle = '#c89040';
      ctx.beginPath();
      ctx.moveTo(p.x + 24, p.y + 14);
      ctx.lineTo(p.x + 36, p.y + 26);
      ctx.lineTo(p.x + 20, p.y + 24);
      ctx.closePath();
      ctx.fill();
      // Bristle lines
      ctx.strokeStyle = '#6a4820';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x + 26, p.y + 16); ctx.lineTo(p.x + 34, p.y + 24);
      ctx.moveTo(p.x + 24, p.y + 18); ctx.lineTo(p.x + 32, p.y + 26);
      ctx.stroke();
    }
    // Name tag
    ctx.fillStyle = '#ffe08a';
    ctx.font = '5px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('MANDY', p.x, p.y + 22);
    ctx.textAlign = 'left';
  }

  function drawRonnie() {
    var r = state.ronnie;
    if (!r) return;
    var bob = Math.sin(state.modeT * 12) * 3;
    // Body
    ctx.fillStyle = '#e85030';
    ctx.beginPath();
    ctx.ellipse(r.x, r.y + bob, 16, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail feathers
    ctx.fillStyle = '#c03020';
    ctx.beginPath();
    ctx.ellipse(r.x - 16, r.y + bob - 4, 10, 6, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f0a020';
    ctx.beginPath();
    ctx.ellipse(r.x - 18, r.y + bob + 4, 8, 5, 0.4, 0, Math.PI * 2);
    ctx.fill();
    // Head
    ctx.fillStyle = '#f0f0e8';
    ctx.beginPath();
    ctx.arc(r.x + 12, r.y + bob - 10, 10, 0, Math.PI * 2);
    ctx.fill();
    // Comb
    ctx.fillStyle = '#d02020';
    ctx.beginPath();
    ctx.arc(r.x + 10, r.y + bob - 20, 4, 0, Math.PI * 2);
    ctx.arc(r.x + 16, r.y + bob - 22, 4.5, 0, Math.PI * 2);
    ctx.arc(r.x + 20, r.y + bob - 18, 3.5, 0, Math.PI * 2);
    ctx.fill();
    // Beak
    ctx.fillStyle = '#f0a020';
    ctx.beginPath();
    ctx.moveTo(r.x + 20, r.y + bob - 10);
    ctx.lineTo(r.x + 30, r.y + bob - 8);
    ctx.lineTo(r.x + 20, r.y + bob - 5);
    ctx.closePath();
    ctx.fill();
    // Eye
    ctx.fillStyle = '#1a0610';
    ctx.beginPath();
    ctx.arc(r.x + 14, r.y + bob - 12, 2, 0, Math.PI * 2);
    ctx.fill();
    // Label
    ctx.fillStyle = '#ffe08a';
    ctx.font = '6px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('RONNIE', r.x, r.y + bob + 24);
    ctx.textAlign = 'left';
  }

  function draw() {
    drawStore();
    var i;
    for (i = 0; i < state.cats.length; i++) drawCat(state.cats[i]);
    drawMandy();
    if (state.ronnie) drawRonnie();

    // Mode overlay hint
    if (state.mode === 'ronnie_intro' || state.mode === 'ronnie_chase' || state.mode === 'ronnie_bounce') {
      ctx.fillStyle = 'rgba(255, 80, 40, 0.12)';
      ctx.fillRect(0, 0, W, H);
    } else if (state.mode === 'mandy_return' || state.mode === 'broom_chase') {
      ctx.fillStyle = 'rgba(80, 200, 120, 0.10)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  var lastTs = 0;
  function frame(ts) {
    if (!ts) ts = performance.now();
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 1 / 60;
    lastTs = ts;
    state._dt = dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  buildShelves();
  resetAll();
  requestAnimationFrame(frame);

  // Test / debug hook (playtest drives cinema + asserts post-reset movement)
  window.__MANDY_STORE__ = {
    getState: function () { return state; },
    getKeys: function () { return keys; },
    setKey: function (k, v) { if (k in keys) keys[k] = !!v; },
    tick: function (dt) { state._dt = dt || 1 / 60; update(dt || 1 / 60); },
    update: update,
    applyWasdMove: applyWasdMove,
    clampPlayer: clampPlayer,
    releaseInputLock: releaseInputLock,
    restorePlayControl: restorePlayControl,
    beginRonnie: beginRonnie,
    softResetKeepScore: softResetKeepScore,
    startLevel: startLevel,
    catExited: catExited,
    assignShelfShuffleTargets: assignShelfShuffleTargets,
    entityDeeplyStuck: entityDeeplyStuck,
    freeSpotNear: freeSpotNear,
    getActivePointerId: function () { return activePointerId; },
    setActivePointerId: function (id) { activePointerId = id; },
    W: W,
    H: H
  };
})();
</script>
</body>
