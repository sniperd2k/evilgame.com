<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EVILGAME — PROGRAM MENU</title>
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-40545865-4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'UA-40545865-4');
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0610;
    color: #c8f0c0;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }
  .crt {
    position: relative;
    width: min(640px, 94vw);
    background: #12101c;
    border: 4px solid #3a3550;
    box-shadow:
      0 0 0 4px #1a1528,
      0 0 40px rgba(80, 255, 120, 0.15),
      inset 0 0 60px rgba(0, 0, 0, 0.55);
    padding: 18px 16px 14px;
  }
  .crt::after {
    content: '';
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px
    );
    opacity: 0.55;
  }
  .header {
    text-align: center;
    margin-bottom: 14px;
    border-bottom: 2px solid #3a3550;
    padding-bottom: 12px;
  }
  .logo {
    color: #7dff9a;
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(125, 255, 154, 0.45);
    margin-bottom: 8px;
  }
  .sub {
    color: #8a8098;
    font-size: 8px;
    line-height: 1.8;
  }
  .blink {
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .menu {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 10px 0 14px;
  }
  .item {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border: 2px solid transparent;
    color: #c8f0c0;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    font: inherit;
    text-align: left;
    width: 100%;
  }
  .item .cursor {
    color: #7dff9a;
    visibility: hidden;
  }
  .item.selected {
    border-color: #7dff9a;
    background: rgba(125, 255, 154, 0.08);
    box-shadow: inset 0 0 0 1px rgba(125, 255, 154, 0.25);
  }
  .item.selected .cursor { visibility: visible; }
  .item .name { font-size: 10px; line-height: 1.5; }
  .item .tag {
    font-size: 7px;
    color: #7dff9a;
    white-space: nowrap;
  }
  .item.soon .name { color: #6a6278; }
  .item.soon .tag { color: #b09040; }
  .item.soon.selected {
    border-color: #b09040;
    background: rgba(176, 144, 64, 0.08);
  }
  .item.soon.selected .cursor { color: #b09040; }
  .footer {
    border-top: 2px solid #3a3550;
    padding-top: 12px;
    font-size: 7px;
    color: #8a8098;
    line-height: 1.9;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: #1a1528;
    border: 2px solid #b09040;
    color: #f0d080;
    font-size: 8px;
    padding: 10px 14px;
    max-width: 90vw;
    text-align: center;
    line-height: 1.8;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 5;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="crt" role="application" aria-label="EvilGame program menu">
    <div class="header">
      <div class="logo">★ EVILGAME OS v0.8 ★</div>
      <div class="sub">PROGRAM SELECT — INSERT COIN <span class="blink">█</span></div>
    </div>
    <ul class="menu" id="menu"></ul>
    <div class="footer">
      <span>↑↓ SELECT · ENTER RUN · ESC BEEP</span>
      <span>SHIP THE CHEDDAR</span>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
<script>
(function () {
  const programs = [
    {
      name: 'AFG — PICKLE ATTIC',
      tag: 'READY',
      href: 'attic.html',
      live: true
    },
    {
      name: 'CHEESE QUEST 64',
      tag: 'COMING SOON',
      blurb: 'Save the cheddar from the fridge dragons. Coming soon!'
    },
    {
      name: 'DUST BUNNY BRAWL',
      tag: 'COMING SOON',
      blurb: 'Sweep or be swept. Coming soon!'
    },
    {
      name: 'TAX FORM SIMULATOR 1099',
      tag: 'COMING SOON',
      blurb: 'Harder than Dark Souls. Coming soon!'
    },
    {
      name: 'MICROWAVE WARS',
      tag: 'COMING SOON',
      blurb: 'Never leave fish unattended. Coming soon!'
    },
    {
      name: 'BASEMENT GOLF CLUB',
      tag: 'COMING SOON',
      blurb: 'Par is a suggestion. Coming soon!'
    }
  ];

  const menu = document.getElementById('menu');
  const toast = document.getElementById('toast');
  let selected = 0;
  let toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('show');
    }, 1800);
  }

  function beep(freq, dur) {
    try {
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = 0.04;
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + (dur || 0.06));
    } catch (e) {}
  }

  function render() {
    menu.innerHTML = '';
    programs.forEach(function (p, i) {
      const li = document.createElement('li');
      const el = document.createElement(p.live ? 'a' : 'button');
      el.className = 'item' + (p.live ? '' : ' soon') + (i === selected ? ' selected' : '');
      el.setAttribute('role', 'menuitem');
      if (p.live) el.href = p.href;
      else el.type = 'button';
      el.innerHTML =
        '<span class="cursor">▶</span>' +
        '<span class="name">' + p.name + '</span>' +
        '<span class="tag">' + p.tag + '</span>';
      el.addEventListener('mouseenter', function () {
        selected = i;
        render();
      });
      el.addEventListener('click', function (ev) {
        selected = i;
        if (!p.live) {
          ev.preventDefault();
          beep(220, 0.08);
          showToast(p.blurb || 'Coming soon!');
          render();
        } else {
          beep(660, 0.05);
        }
      });
      li.appendChild(el);
      menu.appendChild(li);
    });
  }

  function runSelected() {
    const p = programs[selected];
    if (p.live) {
      beep(660, 0.05);
      window.location.href = p.href;
    } else {
      beep(220, 0.08);
      showToast(p.blurb || 'Coming soon!');
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      e.preventDefault();
      selected = (selected + 1) % programs.length;
      beep(440, 0.04);
      render();
    } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      selected = (selected - 1 + programs.length) % programs.length;
      beep(440, 0.04);
      render();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      runSelected();
    } else if (e.key === 'Escape') {
      beep(110, 0.1);
      showToast('NO ESCAPE FROM THE ATTIC');
    }
  });

  render();
})();
</script>
</body>
</html>
