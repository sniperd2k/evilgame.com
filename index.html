<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0610;
    color: #c8f0c0;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }
  .crt {
    position: relative;
    width: min(640px, 94vw);
    background: #12101c;
    border: 4px solid #3a3550;
    box-shadow:
      0 0 0 4px #1a1528,
      0 0 40px rgba(80, 255, 120, 0.15),
      inset 0 0 60px rgba(0, 0, 0, 0.55);
    padding: 18px 16px 14px;
  }
  .crt::after {
    content: '';
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px
    );
    opacity: 0.55;
  }
  .header {
    text-align: center;
    margin-bottom: 14px;
    border-bottom: 2px solid #3a3550;
    padding-bottom: 12px;
  }
  .logo {
    color: #7dff9a;
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(125, 255, 154, 0.45);
    margin-bottom: 8px;
  }
  .sub {
    color: #8a8098;
    font-size: 8px;
    line-height: 1.8;
  }
  .blink {
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .menu {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 10px 0 14px;
  }
  .item {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border: 2px solid transparent;
    color: #c8f0c0;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    font: inherit;
    text-align: left;
    width: 100%;
  }
  .item .cursor {
    color: #7dff9a;
    visibility: hidden;
  }
  .item.selected {
    border-color: #7dff9a;
    background: rgba(125, 255, 154, 0.08);
    box-shadow: inset 0 0 0 1px rgba(125, 255, 154, 0.25);
  }
  .item.selected .cursor { visibility: visible; }
  .item .name { font-size: 10px; line-height: 1.5; }
  .item .tag {
    font-size: 7px;
    color: #7dff9a;
    white-space: nowrap;
  }
  .item.soon .name { color: #6a6278; }
  .item.soon .tag { color: #b09040; }
  .item.soon.selected {
    border-color: #b09040;
    background: rgba(176, 144, 64, 0.08);
  }
  .item.soon.selected .cursor { color: #b09040; }
  .footer {
    border-top: 2px solid #3a3550;
    padding-top: 12px;
    font-size: 7px;
    color: #8a8098;
    line-height: 1.9;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: #1a1528;
    border: 2px solid #b09040;
    color: #f0d080;
    font-size: 8px;
    padding: 10px 14px;
    max-width: 90vw;
    text-align: center;
    line-height: 1.8;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 5;
  }
  .toast.show { opacity: 1; }
  .updated {
    margin-top: 8px;
    color: #7dff9a;
    font-size: 7px;
    letter-spacing: 0.5px;
    line-height: 1.6;
  }
  .updated .dim { color: #8a8098; }
  html, body {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  @media (max-width: 720px), (pointer: coarse) {
    .crt { padding: 14px 10px 12px; width: min(640px, 96vw); }
    .logo { font-size: 11px; }
    .item {
      min-height: 48px;
      padding: 12px 10px;
      gap: 8px;
    }
    .item .name { font-size: 8px; }
    .item .tag { font-size: 6px; }
    .footer { font-size: 6px; }
    .footer .desk { display: none; }
    .footer .mob { display: inline; }
  }
  .footer .mob { display: none; }

  /* AFG soft password gate overlay */
  .afg-gate {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(6, 4, 12, 0.82);
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 720px) and (pointer: fine) {
    .afg-gate { align-items: center; }
  }
  .afg-gate-card {
    width: min(420px, 96vw);
    background: #12101c;
    border: 3px solid #7dff9a;
    box-shadow: 0 0 30px rgba(125,255,154,0.2);
    padding: 16px 14px 12px;
    font-family: 'Press Start 2P', monospace;
  }
  .afg-gate-title {
    color: #7dff9a; font-size: 12px; text-align: center; margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .afg-gate-sub {
    color: #8a8098; font-size: 7px; text-align: center; margin-bottom: 14px;
    line-height: 1.7;
  }
  .afg-gate-label {
    display: block; color: #c8f0c0; font-size: 7px; margin-bottom: 8px;
  }
  .afg-gate-input {
    width: 100%;
    min-height: 52px;
    font-size: 18px;
    padding: 12px 14px;
    border: 2px solid #3a3550;
    background: #0a0610;
    color: #7dff9a;
    font-family: inherit;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .afg-gate-input:focus {
    outline: none; border-color: #7dff9a;
    box-shadow: 0 0 0 2px rgba(125,255,154,0.25);
  }
  .afg-gate-go, .afg-gate-cancel {
    width: 100%; min-height: 48px; margin-top: 10px;
    font: inherit; font-size: 10px; cursor: pointer;
    border: 2px solid #7dff9a; background: rgba(125,255,154,0.12);
    color: #7dff9a; padding: 12px;
  }
  .afg-gate-cancel {
    border-color: #3a3550; color: #8a8098; background: transparent;
    font-size: 8px; min-height: 40px;
  }
  .afg-gate-msg {
    min-height: 18px; margin-top: 10px; text-align: center;
    font-size: 8px; color: #f0d080; line-height: 1.6;
  }
  .item .tag.afg { color: #ff8ad8; }

  /* System Reset — footer OS chrome */
  .reset-btn {
    font: inherit;
    font-size: 7px;
    letter-spacing: 1px;
    color: #8a8098;
    background: transparent;
    border: 2px solid #3a3550;
    padding: 8px 10px;
    min-height: 36px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .reset-btn:hover, .reset-btn:focus {
    outline: none;
    color: #f0d080;
    border-color: #b09040;
    background: rgba(176, 144, 64, 0.1);
    box-shadow: 0 0 10px rgba(176, 144, 64, 0.2);
  }
  .reset-btn:active {
    color: #ff8ad8;
    border-color: #ff8ad8;
  }
  @media (max-width: 720px), (pointer: coarse) {
    .reset-btn {
      font-size: 6px;
      min-height: 44px;
      padding: 10px 12px;
    }
  }

  /* Reset confirm + FX overlays (EVILGAME OS chrome) */
  .reset-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(6, 4, 12, 0.88);
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    overflow: hidden;
    max-width: 100vw;
    max-height: 100dvh;
  }
  @media (min-width: 720px) and (pointer: fine) {
    .reset-overlay { align-items: center; }
  }
  .reset-card {
    width: min(420px, 96vw);
    max-width: 100%;
    background: #12101c;
    border: 3px solid #f0d080;
    box-shadow: 0 0 30px rgba(240,208,128,0.22);
    padding: 16px 14px 12px;
    font-family: 'Press Start 2P', monospace;
    box-sizing: border-box;
  }
  .reset-card-title {
    color: #f0d080; font-size: 11px; text-align: center; margin-bottom: 10px;
    letter-spacing: 1px; line-height: 1.6;
  }
  .reset-card-sub {
    color: #8a8098; font-size: 7px; text-align: center; margin-bottom: 14px;
    line-height: 1.7;
  }
  .reset-card-actions {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .reset-yes, .reset-no {
    flex: 1 1 120px; min-height: 48px;
    font: inherit; font-size: 10px; cursor: pointer;
    border: 2px solid #7dff9a; background: rgba(125,255,154,0.12);
    color: #7dff9a; padding: 12px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .reset-no {
    border-color: #3a3550; color: #8a8098; background: transparent;
    font-size: 8px;
  }
  .reset-yes:active { background: rgba(125,255,154,0.28); }
  .reset-no:active { border-color: #8a8098; color: #c8f0c0; }

  /* AFG meme still — mobile-optimized */
  .reset-meme {
    position: fixed; inset: 0; z-index: 55;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(6, 4, 12, 0.94);
    padding: max(10px, env(safe-area-inset-top, 0px))
             max(10px, env(safe-area-inset-right, 0px))
             max(10px, env(safe-area-inset-bottom, 0px))
             max(10px, env(safe-area-inset-left, 0px));
    box-sizing: border-box;
    overflow: hidden;
    max-width: 100vw;
    max-height: 100dvh;
    width: 100%;
    height: 100%;
  }
  .reset-meme-frame {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
    width: min(640px, 100%);
    max-width: 100%;
    max-height: 100%;
    box-sizing: border-box;
  }
  .reset-meme img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: min(70dvh, calc(100dvh - 96px));
    object-fit: contain;
    image-rendering: pixelated;
    border: 3px solid #ff8ad8;
    box-shadow: 0 0 24px rgba(255,138,216,0.35);
    background: #0a0610;
  }
  .reset-meme-cap {
    color: #ff8ad8;
    font-size: clamp(10px, 3.5vw, 14px);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.5;
    text-shadow: 0 0 10px rgba(255,138,216,0.45);
    max-width: 100%;
    word-break: break-word;
  }

  /* Non-AFG Doom/Duke-style boom */
  .reset-boom {
    position: fixed; inset: 0; z-index: 55;
    pointer-events: none;
    overflow: hidden;
    background: #0a0610;
    max-width: 100vw;
    max-height: 100dvh;
  }
  .reset-boom canvas {
    width: 100%; height: 100%;
    display: block;
  }
</style>
</head>
<body>
  <div class="crt" role="application" aria-label="EvilGame program menu">
    <div class="header">
      <div class="logo">★ EVILGAME OS v0.8 ★</div>
      <div class="sub">PROGRAM SELECT — INSERT COIN <span class="blink">█</span></div>
      <div class="updated" id="lastUpdated"><span class="dim">LAST UPDATED</span> — loading…</div>
    </div>
    <ul class="menu" id="menu"></ul>
    <div class="footer">
      <span><span class="desk">↑↓ SELECT · ENTER RUN · ESC BEEP</span><span class="mob">TAP A PROGRAM TO RUN</span></span>
      <button type="button" class="reset-btn" id="resetBtn" aria-label="Reset all progress">▣ RESET</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
<script src="afg/gate.js"></script>
<script src="afg/play_log.js"></script>
<script src="afg/audio.js"></script>
<script>
(function () {
  // Show date of latest GitHub commit (America/New_York)
  (function loadLastCommit() {
    const el = document.getElementById('lastUpdated');
    if (!el) return;
    const fmt = function (iso) {
      try {
        const d = new Date(iso);
        return new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          year: 'numeric', month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit', hour12: true,
          timeZoneName: 'short'
        }).format(d);
      } catch (e) {
        return iso;
      }
    };
    fetch('https://api.github.com/repos/sniperd2k/evilgame.com/commits?per_page=1')
      .then(function (r) { return r.json(); })
      .then(function (commits) {
        if (!commits || !commits[0] || !commits[0].commit) throw new Error('no commit');
        const iso = commits[0].commit.committer.date || commits[0].commit.author.date;
        el.innerHTML = '<span class="dim">LAST UPDATED</span> — ' + fmt(iso);
      })
      .catch(function () {
        el.innerHTML = '<span class="dim">LAST UPDATED</span> — Sep 25, 2026';
      });
  })();

  const programs = [
    {
      name: 'ATTIC GAMING',
      tag: 'AFG',
      href: 'attic.html',
      live: true,
      afg: true
    },
    {
      name: "MANDY'S STORE",
      tag: 'READY',
      href: 'farm.html',
      live: true
    },
    {
      name: 'CHEESE QUEST 64',
      tag: 'COMING SOON',
      blurb: 'Save the cheddar from the fridge dragons. Coming soon!'
    },
    {
      name: 'DUST BUNNY BRAWL',
      tag: 'COMING SOON',
      blurb: 'Sweep or be swept. Coming soon!'
    },
    {
      name: 'TAX FORM SIMULATOR 1099',
      tag: 'COMING SOON',
      blurb: 'Harder than Dark Souls. Coming soon!'
    },
    {
      name: 'MICROWAVE WARS',
      tag: 'COMING SOON',
      blurb: 'Never leave fish unattended. Coming soon!'
    },
    {
      name: 'BASEMENT GOLF CLUB',
      tag: 'COMING SOON',
      blurb: 'Par is a suggestion. Coming soon!'
    }
  ];

  const menu = document.getElementById('menu');
  const toast = document.getElementById('toast');
  let selected = 0;
  let toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('show');
    }, 1800);
  }

  function beep(freq, dur) {
    try {
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = 0.04;
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + (dur || 0.06));
    } catch (e) {}
  }

  function paintSelection() {
    var items = menu.querySelectorAll('.item');
    for (var i = 0; i < items.length; i++) {
      if (i === selected) items[i].classList.add('selected');
      else items[i].classList.remove('selected');
    }
  }

  function render() {
    menu.innerHTML = '';
    programs.forEach(function (p, i) {
      const li = document.createElement('li');
      const el = document.createElement(p.live ? 'a' : 'button');
      el.className = 'item' + (p.live ? '' : ' soon') + (i === selected ? ' selected' : '');
      el.setAttribute('role', 'menuitem');
      if (p.live) el.href = p.href;
      else el.type = 'button';
      el.innerHTML =
        '<span class="cursor">▶</span>' +
        '<span class="name">' + p.name + '</span>' +
        '<span class="tag">' + p.tag + '</span>';
      // Safari: do NOT rebuild the menu on hover — that destroys the
      // element under the cursor and the click never fires.
      el.addEventListener('mouseenter', function () {
        if (selected === i) return;
        selected = i;
        paintSelection();
      });
      function activate(ev) {
        selected = i;
        paintSelection();
        if (!p.live) {
          if (ev) ev.preventDefault();
          beep(220, 0.08);
          showToast(p.blurb || 'Coming soon!');
          return;
        }
        if (p.afg) {
          if (ev) ev.preventDefault();
          beep(660, 0.05);
          openAfgGate(p.href);
          return;
        }
        beep(660, 0.05);
        // Live rows are real <a href> — let navigation proceed (Safari-safe).
        // Only force location if this wasn't a normal click on the anchor.
        if (!ev || ev.type === 'touchend' || ev.type === 'keydown') {
          if (ev) ev.preventDefault();
          window.location.href = p.href;
        }
      }
      el.addEventListener('click', function (ev) {
        activate(ev);
      });
      el.addEventListener('touchend', function (ev) {
        // Avoid ghost clicks after touch without killing the element.
        ev.preventDefault();
        activate(ev);
      }, { passive: false });
      li.appendChild(el);
      menu.appendChild(li);
    });
  }

  function openAfgGate(href) {
    if (document.querySelector('.afg-gate')) return;
    if (!window.AfgGate) {
      window.location.href = href;
      return;
    }
    AfgGate.checkUnlocked().then(function (ok) {
      if (ok) {
        window.location.href = href;
        return;
      }
      var overlay = AfgGate.createOverlay({
        title: 'AFG LOCK',
        targetHref: href,
        raspberryUrl: 'sfx/raspberry.wav',
        successUrl: 'sfx/stab_painting.wav',
        onCancel: function () { overlay.remove(); }
      });
      document.body.appendChild(overlay);
    });
  }

  function runSelected() {
    const p = programs[selected];
    if (p.live && p.afg) {
      beep(660, 0.05);
      openAfgGate(p.href);
    } else if (p.live) {
      beep(660, 0.05);
      window.location.href = p.href;
    } else {
      beep(220, 0.08);
      showToast(p.blurb || 'Coming soon!');
    }
  }

  // Deep-link: index.html?gate=attic opens the gate immediately.
  (function maybeAutoGate() {
    try {
      var q = new URLSearchParams(window.location.search || '');
      if (q.get('gate') === 'attic' || q.get('gate') === '1') {
        openAfgGate('attic.html');
      }
    } catch (e1) {}
  })();

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      e.preventDefault();
      selected = (selected + 1) % programs.length;
      beep(440, 0.04);
      render();
    } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      selected = (selected - 1 + programs.length) % programs.length;
      beep(440, 0.04);
      render();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      runSelected();
    } else if (e.key === 'Escape') {
      beep(110, 0.1);
      showToast('NO ESCAPE FROM THE ATTIC');
    }
  });

  // System Reset — styled confirm, then AFG meme+audio or non-AFG boom, then wipe.
  var resetBusy = false;
  var RESET_MEME_SRC = 'media/reset-gay-meme.png';
  var RESET_GAY_SFX = 'sfx/gay.wav';
  var menuAudio = (window.EvilAudio && EvilAudio.create) ? EvilAudio.create({
    name: 'index-reset',
    urls: [RESET_GAY_SFX],
    priorityTtl: 3,
    turboPriorityTtl: 1
  }) : null;
  if (menuAudio) {
    // 'gay' is wall-clock until-end (see playGayUntilEnd); boom is procedural.
    menuAudio.register('gay', function (api, extra) {
      return { played: false, skipped: true, reason: 'use-playUntilEnd', url: RESET_GAY_SFX };
    });
    menuAudio.register('boom', function (api) {
      return api.playBoom({ label: 'reset-boom', ctx: beep.ctx });
    });
  }

  function isAfgTaggedUser() {
    try {
      if (window.AfgGate && typeof AfgGate.getCookie === 'function') {
        var v = AfgGate.getCookie(AfgGate.COOKIE_NAME || 'afg_unlock');
        return !!(v && String(v).length);
      }
    } catch (e0) {}
    try {
      var parts = (document.cookie || '').split(';');
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i].replace(/^\s+/, '');
        if (p.indexOf('afg_unlock=') === 0 && p.length > 'afg_unlock='.length) return true;
      }
    } catch (e1) {}
    return false;
  }

  function performWipe() {
    try {
      if (window.AfgPlayLog && typeof AfgPlayLog.endSession === 'function') {
        var wipeUser = 'afg';
        try {
          var rawA = localStorage.getItem('evilgame.attic.v1');
          var rawF = localStorage.getItem('evilgame.farm.v1');
          var po = rawA ? JSON.parse(rawA) : (rawF ? JSON.parse(rawF) : null);
          if (po && po.nick) wipeUser = String(po.nick);
        } catch (eNick) {}
        AfgPlayLog.endSession({ user: wipeUser, end_reason: 'reset_wipe' });
      }
    } catch (ePl) {}
    try {
      if (window.AfgGate && typeof AfgGate.wipeUserData === 'function') {
        AfgGate.wipeUserData();
      } else if (window.AfgGate && typeof AfgGate.clearUnlockCookie === 'function') {
        AfgGate.clearUnlockCookie();
      }
    } catch (e1) {}
  }

  function finishReset() {
    performWipe();
    beep(320, 0.05);
    showToast('RESET COMPLETE');
    setTimeout(function () { resetBusy = false; }, 400);
  }

  function dismissOverlay(el) {
    try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch (e0) {}
  }

  function showResetConfirm(onYes, onNo) {
    if (document.querySelector('.reset-overlay')) return;
    var overlay = document.createElement('div');
    overlay.className = 'reset-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'Are you sure?');
    overlay.innerHTML =
      '<div class="reset-card">' +
        '<div class="reset-card-title">ARE YOU SURE?</div>' +
        '<div class="reset-card-sub">WIPE ALL LOCAL PROGRESS</div>' +
        '<div class="reset-card-actions">' +
          '<button type="button" class="reset-yes">YES</button>' +
          '<button type="button" class="reset-no">NO</button>' +
        '</div>' +
      '</div>';
    var yes = overlay.querySelector('.reset-yes');
    var no = overlay.querySelector('.reset-no');
    function closeNo() {
      dismissOverlay(overlay);
      if (typeof onNo === 'function') onNo();
    }
    function closeYes() {
      dismissOverlay(overlay);
      if (typeof onYes === 'function') onYes();
    }
    yes.addEventListener('click', function (ev) {
      ev.preventDefault();
      beep(660, 0.05);
      closeYes();
    });
    no.addEventListener('click', function (ev) {
      ev.preventDefault();
      beep(110, 0.06);
      closeNo();
    });
    overlay.addEventListener('click', function (ev) {
      if (ev.target === overlay) {
        beep(110, 0.06);
        closeNo();
      }
    });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') {
        document.removeEventListener('keydown', esc);
        beep(110, 0.06);
        closeNo();
      }
    });
    document.body.appendChild(overlay);
    try { yes.focus(); } catch (e2) {}
  }

  function playGayUntilEnd(onEnded) {
    // Event-driven: notify listeners, then wall-clock until-end scheduler.
    if (menuAudio) {
      menuAudio.fire('gay'); // logs cue; playback is playUntilEnd (real-time)
      menuAudio.playUntilEnd(RESET_GAY_SFX, onEnded, 2000);
      return;
    }
    var done = false;
    var timer = null;
    function finish() {
      if (done) return;
      done = true;
      if (timer != null) { try { clearTimeout(timer); } catch (eC) {} timer = null; }
      if (typeof onEnded === 'function') onEnded();
    }
    try { setTimeout(finish, 400); } catch (e0) { finish(); }
  }

  function showAfgMemeThenWipe() {
    var wrap = document.createElement('div');
    wrap.className = 'reset-meme';
    wrap.setAttribute('role', 'img');
    wrap.setAttribute('aria-label', 'Gay.');
    wrap.innerHTML =
      '<div class="reset-meme-frame">' +
        '<img src="' + RESET_MEME_SRC + '" alt="Gay." width="640" height="480" decoding="async" />' +
        '<div class="reset-meme-cap">Gay.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    // Hold still for ENTIRE audio duration, then wipe.
    playGayUntilEnd(function () {
      dismissOverlay(wrap);
      finishReset();
    });
  }

  function showBoomThenWipe() {
    var wrap = document.createElement('div');
    wrap.className = 'reset-boom';
    var canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    document.body.appendChild(wrap);

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    function size() {
      var w = window.innerWidth;
      var h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    size();

    var ctx = canvas.getContext('2d');
    var cx = canvas.width / 2;
    var cy = canvas.height / 2;
    var particles = [];
    var i, ang, spd, hue;
    for (i = 0; i < 90; i++) {
      ang = Math.random() * Math.PI * 2;
      spd = 2 + Math.random() * 9;
      hue = Math.random();
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd * dpr,
        vy: Math.sin(ang) * spd * dpr,
        life: 1,
        decay: 0.018 + Math.random() * 0.025,
        r: (2 + Math.random() * 5) * dpr,
        color: hue < 0.45 ? '#ff5020' : (hue < 0.75 ? '#f0d080' : '#fff0c0')
      });
    }

    // Duke/Doom-ish boom SFX via EvilAudio scheduler (wall-clock oscillators)
    try {
      beep.ctx = beep.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (menuAudio) menuAudio.fire('boom');
      else {
        var ac = beep.ctx;
        var t0 = ac.currentTime;
        function boomTone(freq, start, dur, type, vol) {
          var o = ac.createOscillator();
          var g = ac.createGain();
          o.type = type || 'square';
          o.frequency.setValueAtTime(freq, t0 + start);
          o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.2), t0 + start + dur);
          g.gain.setValueAtTime(vol || 0.08, t0 + start);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + start + dur);
          o.connect(g); g.connect(ac.destination);
          o.start(t0 + start); o.stop(t0 + start + dur + 0.02);
        }
        boomTone(120, 0, 0.35, 'sawtooth', 0.1);
        boomTone(55, 0.02, 0.45, 'square', 0.08);
        boomTone(400, 0, 0.12, 'square', 0.05);
      }
    } catch (eSfx) {}

    var frames = 0;
    var maxFrames = 48;
    function frame() {
      frames++;
      ctx.fillStyle = 'rgba(10,6,16,0.22)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // flash
      if (frames < 6) {
        ctx.fillStyle = 'rgba(255,' + (200 - frames * 20) + ',80,' + (0.55 - frames * 0.08) + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      // shock rings
      var ring = frames * 12 * dpr;
      ctx.strokeStyle = 'rgba(255,80,32,' + Math.max(0, 0.7 - frames * 0.03) + ')';
      ctx.lineWidth = 4 * dpr;
      ctx.beginPath();
      ctx.arc(cx, cy, ring, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(240,208,128,' + Math.max(0, 0.5 - frames * 0.025) + ')';
      ctx.beginPath();
      ctx.arc(cx, cy, ring * 0.6, 0, Math.PI * 2);
      ctx.stroke();

      for (i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.15 * dpr;
        p.life -= p.decay;
        if (p.life <= 0) continue;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.r, p.r);
      }
      ctx.globalAlpha = 1;
      if (frames < maxFrames) {
        requestAnimationFrame(frame);
      } else {
        dismissOverlay(wrap);
        finishReset();
      }
    }
    requestAnimationFrame(frame);
  }

  function doReset() {
    if (resetBusy) return;
    resetBusy = true;
    beep(180, 0.08);
    showResetConfirm(
      function onYes() {
        if (isAfgTaggedUser()) showAfgMemeThenWipe();
        else showBoomThenWipe();
      },
      function onNo() {
        resetBusy = false;
      }
    );
  }

  var resetBtn = document.getElementById('resetBtn');
  if (resetBtn) {
    resetBtn.addEventListener('click', function (ev) {
      ev.preventDefault();
      doReset();
    });
  }

  render();
})();
</script>
</body>
</html>
