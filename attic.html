<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tic Tac Toe — EVILGAME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: #0a0610;
    color: #c8f0c0;
    font-family: 'Press Start 2P', monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
  }
  h1 {
    font-size: clamp(12px, 3.5vw, 16px);
    color: #7cff9a;
    text-align: center;
    line-height: 1.6;
  }
  .status {
    font-size: 10px;
    color: #a8d8a0;
    min-height: 2.4em;
    text-align: center;
    line-height: 1.6;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: min(320px, 86vw);
    aspect-ratio: 1;
  }
  .cell {
    background: #12101c;
    border: 3px solid #3a3550;
    color: #7cff9a;
    font-family: inherit;
    font-size: clamp(28px, 10vw, 42px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.45);
  }
  .cell:hover:not(:disabled) { border-color: #7cff9a; }
  .cell:disabled { cursor: default; }
  .cell.win { background: #1a3a24; border-color: #7cff9a; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button.btn {
    font-family: inherit;
    font-size: 9px;
    padding: 12px 16px;
    background: #1a1528;
    color: #c8f0c0;
    border: 3px solid #3a3550;
    cursor: pointer;
  }
  button.btn:hover { border-color: #7cff9a; color: #7cff9a; }
  a.back {
    font-size: 8px;
    color: #6a8870;
    text-decoration: none;
  }
  a.back:hover { color: #7cff9a; }
</style>
</head>
<body>
  <h1>TIC TAC TOE</h1>
  <p class="status" id="status">X goes first</p>
  <div class="board" id="board" aria-label="Tic tac toe board"></div>
  <div class="actions">
    <button type="button" class="btn" id="reset">NEW GAME</button>
  </div>
  <a class="back" href="index.html">← PROGRAM MENU</a>
<script>
(function () {
  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  let cells = Array(9).fill(null);
  let turn = 'X';
  let over = false;
  const board = document.getElementById('board');
  const status = document.getElementById('status');
  const buttons = [];

  function winner() {
    for (const [a,b,c] of wins) {
      if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
        return { mark: cells[a], line: [a,b,c] };
      }
    }
    return null;
  }

  function render() {
    const w = winner();
    buttons.forEach((btn, i) => {
      btn.textContent = cells[i] || '';
      btn.disabled = over || cells[i] !== null;
      btn.classList.toggle('win', !!(w && w.line.includes(i)));
    });
    if (w) {
      over = true;
      status.textContent = w.mark + ' wins!';
    } else if (cells.every(Boolean)) {
      over = true;
      status.textContent = "It's a draw.";
    } else {
      status.textContent = turn + ' goes next';
    }
  }

  function play(i) {
    if (over || cells[i]) return;
    cells[i] = turn;
    turn = turn === 'X' ? 'O' : 'X';
    render();
  }

  function reset() {
    cells = Array(9).fill(null);
    turn = 'X';
    over = false;
    render();
  }

  for (let i = 0; i < 9; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cell';
    btn.setAttribute('aria-label', 'Cell ' + (i + 1));
    btn.addEventListener('click', () => play(i));
    board.appendChild(btn);
    buttons.push(btn);
  }
  document.getElementById('reset').addEventListener('click', reset);
  render();
})();
</script>
</body>
</html>
