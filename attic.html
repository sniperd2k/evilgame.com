<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Attic Gaming — EVILGAME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0610;
    color: #c8f0c0;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
  }
  .hud {
    width: min(720px, 96vw);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: clamp(8px, 2.2vw, 10px);
    line-height: 1.5;
    color: #7cff9a;
  }
  .hud span { color: #c8f0c0; }
  #wrap {
    position: relative;
    width: min(720px, 96vw);
    aspect-ratio: 4 / 3;
    max-height: min(70vh, 540px);
    border: 4px solid #3a3550;
    box-shadow: 0 0 0 4px #1a1528, 0 0 40px rgba(80, 255, 120, 0.12);
    background: #1a1410;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }
  #msg {
    width: min(720px, 96vw);
    min-height: 3.2em;
    font-size: clamp(8px, 2.2vw, 10px);
    line-height: 1.6;
    text-align: center;
    color: #ffe08a;
  }
  .bar {
    width: min(720px, 96vw);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  a.back, button.reset {
    font-family: inherit;
    font-size: 8px;
    color: #6a8870;
    text-decoration: none;
    background: transparent;
    border: 2px solid #3a3550;
    padding: 8px 10px;
    cursor: pointer;
  }
  a.back:hover, button.reset:hover { color: #7cff9a; border-color: #7cff9a; }
</style>
</head>
<body>
  <div class="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>ROOM <span id="room">1</span></div>
    <div>NUGS <span id="nugs">0</span>/5</div>
  </div>
  <div id="wrap"><canvas id="c" width="640" height="480"></canvas></div>
  <div id="msg">Drag your guy. Grab those McIntyre nugs.</div>
  <div class="bar">
    <a class="back" href="index.html">← PROGRAM MENU</a>
    <button type="button" class="reset" id="reset">RESET</button>
  </div>
<script>
(function () {
  var W = 640, H = 480;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var elScore = document.getElementById('score');
  var elRoom = document.getElementById('room');
  var elNugs = document.getElementById('nugs');
  var elMsg = document.getElementById('msg');

  var NUG_LINES = [
    'GOING TO GET ME MCINTYRE NUGGETS',
    'GOOD MCINTYRE NUGS!',
    'MMN THOSE MCINTYRE NUGS',
    'MORE MCINTYRE PLEASE',
    'NUG ACQUIRED — MCINTYRE STYLE'
  ];

  var state = {
    score: 0,
    room: 1,
    roomNugs: 0,
    nugsSinceShrink: 0,
    size: 1,
    doorOpen: false,
    doorSide: 'right',
    tooBig: false,
    belchertown: false,
    scene: 'attic',
    salad: 0,
    nuggets: [],
    player: { x: W / 2, y: H / 2 },
    dragging: false,
    dragOff: { x: 0, y: 0 },
    doorLatch: false,
    belchLatch: false,
    edgeLatch: false,
    recenterDrag: false,
    edgeGrace: 0,
    belchItems: [],
    saladInset: 34,
    saladClosing: false,
    saladCloseT: 0,
    saladShouted: false
  };

  function say(text) {
    elMsg.textContent = text;
  }

  function playerRadius() {
    return 14 * state.size;
  }

  function dist(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function hud() {
    elScore.textContent = String(state.score);
    elRoom.textContent = String(state.room);
    elNugs.textContent = String(state.roomNugs);
  }

  function spawnNuggets() {
    // Fully random nug spots each room (keep clear of edges / center spawn).
    var nugs = [];
    var tries = 0;
    while (nugs.length < 5 && tries < 120) {
      tries += 1;
      var x = 70 + Math.random() * (W - 140);
      var y = 70 + Math.random() * (H - 140);
      var ok = true;
      // Don't drop a nug right on the player
      if (dist(x, y, state.player.x, state.player.y) < 70) ok = false;
      for (var i = 0; i < nugs.length && ok; i++) {
        if (dist(x, y, nugs[i].x, nugs[i].y) < 56) ok = false;
      }
      if (!ok) continue;
      nugs.push({ x: x, y: y, r: 12, eaten: false });
    }
    // Fallback fill if RNG got unlucky
    while (nugs.length < 5) {
      nugs.push({
        x: 80 + nugs.length * 90,
        y: 120 + (nugs.length % 2) * 160,
        r: 12,
        eaten: false
      });
    }
    state.nuggets = nugs;
    state.doorLatch = false;
    state.belchLatch = false;
  }

  function pickDoorSide() {
    var sides = ['right', 'left', 'top', 'bottom'];
    // When Belchertown is looming on the left wall, keep the door off that wall.
    if (state.tooBig || state.nugsSinceShrink >= 15) {
      sides = ['right', 'top', 'bottom'];
    }
    // Prefer a different wall than last time when possible.
    if (state.doorSide && sides.length > 1) {
      var filtered = sides.filter(function (s) { return s !== state.doorSide; });
      if (filtered.length) sides = filtered;
    }
    return sides[Math.floor(Math.random() * sides.length)];
  }

  function oppositeSide(side) {
    if (side === 'left') return 'right';
    if (side === 'right') return 'left';
    if (side === 'top') return 'bottom';
    return 'top';
  }

  function doorGeom() {
    // Returns { x, y, w, h, cx, cy, r } for the open door on state.doorSide.
    var side = state.doorSide || 'right';
    var w, h, x, y;
    if (side === 'left' || side === 'right') {
      w = 56; h = 90;
      y = H / 2 - h / 2;
      x = side === 'right' ? (W - 18 - w) : 18;
    } else {
      w = 90; h = 56;
      x = W / 2 - w / 2;
      y = side === 'top' ? 40 : (H - 18 - h);
    }
    return { x: x, y: y, w: w, h: h, cx: x + w / 2, cy: y + h / 2, r: 36, side: side };
  }

  function placePlayerAtEntry(entrySide) {
    var margin = 54 + playerRadius();
    if (entrySide === 'left') {
      state.player.x = margin;
      state.player.y = H / 2;
    } else if (entrySide === 'right') {
      state.player.x = W - margin;
      state.player.y = H / 2;
    } else if (entrySide === 'top') {
      state.player.x = W / 2;
      state.player.y = margin + 10;
    } else {
      state.player.x = W / 2;
      state.player.y = H - margin;
    }
    state.recenterDrag = true;
  }

  function resetAll() {
    state.score = 0;
    state.room = 1;
    state.roomNugs = 0;
    state.nugsSinceShrink = 0;
    state.size = 1;
    state.doorOpen = false;
    state.tooBig = false;
    state.belchertown = false;
    state.scene = 'attic';
    state.salad = 0;
    state.edgeLatch = false;
    state.recenterDrag = false;
    state.edgeGrace = 0;
    state.belchItems = [];
    state.saladInset = 34;
    state.saladClosing = false;
    state.saladCloseT = 0;
    state.saladShouted = false;
    state.doorSide = 'right';
    state.player.x = W / 2;
    state.player.y = H / 2;
    spawnNuggets();
    hud();
    say('Drag your guy. Grab those McIntyre nugs.');
  }

  function enterNextRoom() {
    var exitSide = state.doorSide || 'right';
    var entrySide = oppositeSide(exitSide);
    state.room += 1;
    state.roomNugs = 0;
    state.doorOpen = false;
    // Walk in from the opposite wall, like a new connected room.
    placePlayerAtEntry(entrySide);
    spawnNuggets();
    hud();
    say('SAME ATTIC. NEW NUGS. ROOM ' + state.room);
  }

  function tryDoor() {
    if (!state.doorOpen) return;
    if (state.tooBig || state.nugsSinceShrink >= 15) {
      state.tooBig = true;
      state.belchertown = true;
      playBelchertownLine();
      say('TIME TO FUCK OFF TO BELCHERTOWN.');
      return;
    }
    enterNextRoom();
  }

  function spawnBelchItems() {
    var total = 1 + Math.floor(Math.random() * 10); // 1..10
    var items = [];
    var tries = 0;
    while (items.length < total && tries < 80) {
      tries += 1;
      var x = 70 + Math.random() * (W - 140);
      var y = 70 + Math.random() * (H - 140);
      var ok = true;
      for (var i = 0; i < items.length; i++) {
        if (dist(x, y, items[i].x, items[i].y) < 36) { ok = false; break; }
      }
      if (!ok) continue;
      items.push({
        x: x,
        y: y,
        r: 14,
        kind: Math.random() < 0.5 ? 'chopsticks' : 'cookie',
        eaten: false
      });
    }
    state.belchItems = items;
  }

  function belchItemsLeft() {
    var n = 0;
    for (var i = 0; i < state.belchItems.length; i++) {
      if (!state.belchItems[i].eaten) n += 1;
    }
    return n;
  }

  function eatBelchItem(it) {
    if (it.eaten) return;
    it.eaten = true;
    state.score -= 5;
    hud();
    playSlurp();
    var left = belchItemsLeft();
    if (left <= 0) {
      state.saladClosing = true;
      state.saladCloseT = 0;
      // Shout while it collapses — not after.
      if (!state.saladShouted) {
        state.saladShouted = true;
        say("I don't even like salad");
        playDontLikeSalad();
      }
    } else {
      say((it.kind === 'chopsticks' ? 'CHOPSTICKS' : 'FORTUNE COOKIE') + ' −5. ' + left + ' LEFT.');
    }
  }

  function enterBelchertownRoom() {
    if (!state.belchertown) return;
    state.scene = 'belch';
    state.belchertown = false;
    state.edgeLatch = false;
    state.player.x = W / 2;
    state.player.y = H / 2;
    state.recenterDrag = true;
    state.edgeGrace = 0;
    state.saladInset = 34;
    state.saladClosing = false;
    state.saladCloseT = 0;
    state.saladShouted = false;
    spawnBelchItems();
    say('BELCHERTOWN. GRAB CHOPSTICKS & FORTUNE COOKIES (−5). SALAD LINES THE WALLS.');
  }

  function returnToStartRoom() {
    state.salad = 90;
    state.size = 1;
    state.nugsSinceShrink = 0;
    state.tooBig = false;
    state.belchertown = false;
    state.doorOpen = false;
    state.roomNugs = 0;
    state.room = 1;
    state.scene = 'attic';
    state.edgeLatch = false;
    state.recenterDrag = false;
    state.saladClosing = false;
    state.saladCloseT = 0;
    state.saladInset = 34;
    state.belchItems = [];
    state.saladShouted = false;
    state.player.x = W / 2;
    state.player.y = H / 2;
    spawnNuggets();
    hud();
  }

  function finishBelchertownSalad() {
    if (state.scene !== 'belch') return;
    // Voice already played mid-collapse; dump him small in room 1.
    state.saladClosing = false;
    state.player.x = W / 2;
    state.player.y = H / 2;
    returnToStartRoom();
  }

  function hitBelchertown() {
    enterBelchertownRoom();
  }

  function eatNug(n) {
    n.eaten = true;
    state.score += 5;
    state.roomNugs += 1;
    state.nugsSinceShrink += 1;
    state.size = 1 + state.nugsSinceShrink * 0.12;
    if (state.nugsSinceShrink >= 15) {
      state.tooBig = true;
    }
    playSlurp();
    var line = NUG_LINES[(Math.floor(state.score / 5) - 1) % NUG_LINES.length];
    if (state.roomNugs >= 5) {
      state.doorOpen = true;
      state.doorSide = pickDoorSide();
      playDoorOpen();
      say('I open the door.');
    } else {
      say(line);
    }
    hud();
  }

  var audioCtx = null;
  var audioUnlocked = false;
  var sfxEls = {};
  var currentSfx = null;
  // Belchertown voice owns the mic — other SFX cannot cut it while this is true.
  var voicePriority = false;

  // Five handmade wet slurps — pick one at random on each nug.
  var SLURP_URLS = [
    'sfx/slurp1.wav',
    'sfx/slurp2.wav',
    'sfx/slurp3.wav',
    'sfx/slurp4.wav',
    'sfx/slurp5.wav'
  ];
  var ALL_SFX_URLS = SLURP_URLS.concat([
    'sfx/door-open.wav',
    'sfx/dont-like-salad.wav',
    'sfx/belchertown.wav'
  ]);

  function ensureAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch (e1) {}
      }
      return audioCtx;
    } catch (err) {
      return null;
    }
  }

  function getSfxEl(url) {
    if (!sfxEls[url]) {
      var a = new Audio();
      a.preload = 'auto';
      a.src = url;
      try { a.setAttribute('playsinline', ''); a.playsInline = true; } catch (e1) {}
      try { a.load(); } catch (e2) {}
      sfxEls[url] = a;
    }
    return sfxEls[url];
  }

  // iOS (Safari + Chrome) only unlocks audio inside a real user gesture.
  // Menu works because it beeps on tap; we do the same here on first touch.
  function unlockAudio() {
    var ctx = ensureAudio();
    if (ctx) {
      try {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        g.gain.value = 0.0001;
        o.connect(g);
        g.connect(ctx.destination);
        o.start(0);
        o.stop(ctx.currentTime + 0.04);
      } catch (e1) {}
      try { ctx.resume(); } catch (e2) {}
    }
    var i, a, p;
    for (i = 0; i < ALL_SFX_URLS.length; i++) {
      a = getSfxEl(ALL_SFX_URLS[i]);
      try {
        a.muted = true;
        a.volume = 0;
        p = a.play();
        if (p && typeof p.then === 'function') {
          p.then(function (el) {
            return function () {
              try { el.pause(); el.currentTime = 0; } catch (e3) {}
              el.muted = false;
              el.volume = 1;
            };
          }(a)).catch(function (el) {
            return function () { el.muted = false; el.volume = 1; };
          }(a));
        } else {
          try { a.pause(); a.currentTime = 0; } catch (e4) {}
          a.muted = false;
          a.volume = 1;
        }
      } catch (e5) {
        a.muted = false;
        a.volume = 1;
      }
    }
    audioUnlocked = true;
  }

  function stopCurrentSfx() {
    if (!currentSfx) return;
    try { currentSfx.pause(); } catch (e1) {}
    try { currentSfx.currentTime = 0; } catch (e2) {}
    currentSfx = null;
  }

  function clearVoicePriority() {
    voicePriority = false;
  }

  // opts.priority: Belchertown voice — cuts everything, and nothing else may cut it.
  function playHtmlSfx(url, vol, opts) {
    try {
      opts = opts || {};
      var priority = !!opts.priority;
      if (!audioUnlocked) unlockAudio();
      // While Belchertown owns the mic, lesser SFX are ignored.
      if (voicePriority && !priority) return;
      stopCurrentSfx();
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e0) {}
      if (priority) voicePriority = true;
      else voicePriority = false;
      // Prefer a fresh element with the same src — most reliable on iOS after unlock.
      var a = new Audio();
      try { a.setAttribute('playsinline', ''); a.playsInline = true; } catch (e1) {}
      a.src = url;
      a.muted = false;
      a.volume = vol == null ? 1 : vol;
      a.onended = function () {
        if (currentSfx === a) currentSfx = null;
        if (priority) clearVoicePriority();
      };
      currentSfx = a;
      var p = a.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function () {
          // Last resort: replay the primed pool element.
          try {
            stopCurrentSfx();
            var b = getSfxEl(url);
            b.muted = false;
            b.volume = vol == null ? 1 : vol;
            try { b.currentTime = 0; } catch (e2) {}
            b.onended = function () {
              if (currentSfx === b) currentSfx = null;
              if (priority) clearVoicePriority();
            };
            currentSfx = b;
            var p2 = b.play();
            if (p2 && typeof p2.catch === 'function') p2.catch(function () {
              if (currentSfx === b) currentSfx = null;
              if (priority) clearVoicePriority();
            });
          } catch (e3) {
            if (priority) clearVoicePriority();
          }
        });
      }
    } catch (err) {
      if (opts && opts.priority) clearVoicePriority();
    }
  }

  function playSlurp() {
    var url = SLURP_URLS[Math.floor(Math.random() * SLURP_URLS.length)];
    playHtmlSfx(url, 0.95);
  }

  function playDoorOpen() {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e1) {}
    playHtmlSfx('sfx/door-open.wav', 1);
  }

  function loadSlurps() {
    // Preload HTMLAudio elements (iOS-friendly). Kept for callers.
    var i;
    for (i = 0; i < SLURP_URLS.length; i++) getSfxEl(SLURP_URLS[i]);
  }

  function loadDoorOpen() {
    getSfxEl('sfx/door-open.wav');
  }

  function loadSaladLine() {
    getSfxEl('sfx/dont-like-salad.wav');
  }

  function playDontLikeSalad() {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e1) {}
    playHtmlSfx('sfx/dont-like-salad.wav', 1);
  }

  function loadBelchertownLine() {
    getSfxEl('sfx/belchertown.wav');
  }

  function playBelchertownLine() {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e1) {}
    // Always owns the mic — slurps/doors/salad cannot cut this line.
    playHtmlSfx('sfx/belchertown.wav', 1, { priority: true });
  }

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    var src = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return {
      x: (src.clientX - rect.left) * (W / rect.width),
      y: (src.clientY - rect.top) * (H / rect.height)
    };
  }

  function onDown(e) {
    e.preventDefault();
    unlockAudio();
    loadSlurps();
    loadDoorOpen();
    loadSaladLine();
    loadBelchertownLine();
    var p = pointerPos(e);
    // Drag anywhere on the canvas: finger need not be on the guy.
    // Offset keeps him from jumping under the pointer; he moves with the drag.
    state.dragging = true;
    canvas.classList.add('dragging');
    state.dragOff.x = state.player.x - p.x;
    state.dragOff.y = state.player.y - p.y;
  }

  function onMove(e) {
    if (!state.dragging) return;
    e.preventDefault();
    var p = pointerPos(e);
    var r = playerRadius();
    if (state.recenterDrag) {
      state.dragOff.x = state.player.x - p.x;
      state.dragOff.y = state.player.y - p.y;
      state.recenterDrag = false;
    }
    var x = p.x + state.dragOff.x;
    var y = p.y + state.dragOff.y;
    if (state.scene === 'belch') {
      var rim = (state.saladInset || 34) + 4;
      if (state.saladClosing) {
        // While salad crushes in, keep him on-screen but let update push him center.
        x = Math.max(r, Math.min(W - r, x));
        y = Math.max(r, Math.min(H - r, y));
      } else {
        x = Math.max(rim + r, Math.min(W - rim - r, x));
        y = Math.max(rim + r, Math.min(H - rim - r, y));
      }
    } else {
      x = Math.max(r + 8, Math.min(W - r - 8, x));
      y = Math.max(r + 28, Math.min(H - r - 8, y));
    }
    state.player.x = x;
    state.player.y = y;
  }

  function onUp(e) {
    if (!state.dragging) return;
    e.preventDefault();
    state.dragging = false;
    canvas.classList.remove('dragging');
  }

  // Silent WASD (no on-screen hint). Window-level so no canvas focus needed.
  var keys = { w: false, a: false, s: false, d: false };
  var WASD_SPEED = 3.6;

  function onKeyDown(e) {
    var k = e.key;
    if (!k) return;
    k = k.length === 1 ? k.toLowerCase() : k;
    if (k === 'w' || k === 'a' || k === 's' || k === 'd') {
      e.preventDefault();
      keys[k] = true;
      unlockAudio();
    }
  }

  function onKeyUp(e) {
    var k = e.key;
    if (!k) return;
    k = k.length === 1 ? k.toLowerCase() : k;
    if (k === 'w' || k === 'a' || k === 's' || k === 'd') {
      e.preventDefault();
      keys[k] = false;
    }
  }

  function applyWasdMove() {
    if (state.dragging) return;
    if (state.scene === 'belch' && state.saladClosing) return;
    var dx = 0, dy = 0;
    if (keys.w) dy -= 1;
    if (keys.s) dy += 1;
    if (keys.a) dx -= 1;
    if (keys.d) dx += 1;
    if (!dx && !dy) return;
    // Normalize diagonal so it isn't faster
    var len = Math.sqrt(dx * dx + dy * dy);
    dx = (dx / len) * WASD_SPEED;
    dy = (dy / len) * WASD_SPEED;
    var r = playerRadius();
    var x = state.player.x + dx;
    var y = state.player.y + dy;
    if (state.scene === 'belch') {
      var rim = (state.saladInset || 34) + 4;
      x = Math.max(rim + r, Math.min(W - rim - r, x));
      y = Math.max(rim + r, Math.min(H - rim - r, y));
    } else {
      x = Math.max(r + 8, Math.min(W - r - 8, x));
      y = Math.max(r + 28, Math.min(H - r - 8, y));
    }
    state.player.x = x;
    state.player.y = y;
  }

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp, { passive: false });
  canvas.addEventListener('pointerdown', function (e) {
    // Extra unlock path for iOS Safari / Chrome (WebKit).
    unlockAudio();
  }, { passive: true });
  document.getElementById('reset').addEventListener('click', function () {
    unlockAudio();
    resetAll();
  });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', function () {
    keys.w = keys.a = keys.s = keys.d = false;
  });

  function drawAttic() {
    ctx.fillStyle = '#2a1e14';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#3a2a1c';
    ctx.lineWidth = 2;
    for (var y = 40; y < H; y += 28) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.fillStyle = '#1a120c';
    ctx.fillRect(0, 0, W, 36);
    ctx.strokeStyle = '#4a3828';
    for (var x = 0; x < W; x += 80) {
      ctx.beginPath();
      ctx.moveTo(x, 36);
      ctx.lineTo(x + 40, 120);
      ctx.lineTo(x + 80, 36);
      ctx.stroke();
    }
    ctx.strokeStyle = '#5a4838';
    ctx.lineWidth = 6;
    ctx.strokeRect(6, 36, W - 12, H - 42);

    // dusty label
    ctx.fillStyle = '#6a5848';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('ATTIC GAMING', 16, 24);
  }

  function drawDoor() {
    if (!state.doorOpen) return;
    var d = doorGeom();
    ctx.fillStyle = state.tooBig ? '#4a2030' : '#3a5a28';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.strokeStyle = '#7cff9a';
    ctx.lineWidth = 3;
    ctx.strokeRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = '#c8f0c0';
    ctx.font = '8px "Press Start 2P"';
    ctx.textAlign = 'center';
    if (d.side === 'top') {
      ctx.fillText('DOOR', d.cx, d.y + d.h + 14);
    } else if (d.side === 'bottom') {
      ctx.fillText('DOOR', d.cx, d.y - 8);
    } else if (d.side === 'left') {
      ctx.fillText('DOOR', d.cx + d.w / 2 + 28, d.cy + 3);
    } else {
      ctx.fillText('DOOR', d.cx - d.w / 2 - 28, d.cy + 3);
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath();
    if (d.side === 'left') ctx.arc(d.x + d.w - 12, d.cy, 4, 0, Math.PI * 2);
    else if (d.side === 'right') ctx.arc(d.x + 12, d.cy, 4, 0, Math.PI * 2);
    else if (d.side === 'top') ctx.arc(d.cx, d.y + d.h - 12, 4, 0, Math.PI * 2);
    else ctx.arc(d.cx, d.y + 12, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBelchertown() {
    if (state.scene === 'belch' || !state.belchertown) return;
    var x = 8, y = H / 2 - 50, w = 28, h = 100;
    ctx.fillStyle = '#203050';
    ctx.fillRect(x, y, w, h);
    ctx.save();
    ctx.translate(x + 20, y + 90);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#9ec8ff';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('BELCHERTOWN', 0, 0);
    ctx.restore();
  }

  function drawBelchItem(it) {
    if (it.eaten) return;
    if (it.kind === 'chopsticks') {
      ctx.strokeStyle = '#d8b070';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(it.x - 10, it.y + 12);
      ctx.lineTo(it.x - 2, it.y - 12);
      ctx.moveTo(it.x + 2, it.y + 12);
      ctx.lineTo(it.x + 10, it.y - 12);
      ctx.stroke();
      ctx.fillStyle = '#ffe8a0';
      ctx.font = '6px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('CHOP', it.x, it.y + 22);
      ctx.textAlign = 'left';
    } else {
      ctx.fillStyle = '#e8c070';
      ctx.beginPath();
      ctx.ellipse(it.x, it.y, 12, 9, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#a87830';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(it.x - 10, it.y);
      ctx.lineTo(it.x + 10, it.y);
      ctx.stroke();
      ctx.fillStyle = '#fff0c8';
      ctx.font = '6px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('COOKIE', it.x, it.y + 20);
      ctx.textAlign = 'left';
    }
  }

  function drawTomato(x, y, s) {
    ctx.fillStyle = '#d03028';
    ctx.beginPath();
    ctx.arc(x, y, 5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f06050';
    ctx.beginPath();
    ctx.arc(x - 1.5 * s, y - 1.5 * s, 1.8 * s, 0, Math.PI * 2);
    ctx.fill();
    // stem nub
    ctx.fillStyle = '#3a8020';
    ctx.fillRect(x - 1 * s, y - 6 * s, 2 * s, 3 * s);
  }

  function drawCucumber(x, y, ang, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = '#4a9a38';
    ctx.beginPath();
    ctx.ellipse(0, 0, 10 * s, 3.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2e6a24';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-6 * s, -1 * s);
    ctx.lineTo(6 * s, -1 * s);
    ctx.moveTo(-5 * s, 1.2 * s);
    ctx.lineTo(5 * s, 1.2 * s);
    ctx.stroke();
    ctx.fillStyle = '#c8e878';
    ctx.beginPath();
    ctx.ellipse(-2 * s, -0.8 * s, 2 * s, 0.8 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSaladBorder() {
    var inset = state.saladInset;
    // leafy green rim around the room
    ctx.fillStyle = '#3a7a28';
    ctx.fillRect(0, 0, W, inset);
    ctx.fillRect(0, H - inset, W, inset);
    ctx.fillRect(0, 0, inset, H);
    ctx.fillRect(W - inset, 0, inset, H);
    // darker lettuce under-layer
    ctx.fillStyle = '#2e6020';
    ctx.fillRect(0, 0, W, Math.max(4, inset * 0.22));
    ctx.fillRect(0, H - Math.max(4, inset * 0.22), W, Math.max(4, inset * 0.22));
    ctx.fillRect(0, 0, Math.max(4, inset * 0.22), H);
    ctx.fillRect(W - Math.max(4, inset * 0.22), 0, Math.max(4, inset * 0.22), H);

    // leaf speckles
    var i, lx, ly, s;
    ctx.fillStyle = '#6ab040';
    for (i = 0; i < 40; i++) {
      lx = (i * 47) % W;
      ly = (i % 2 === 0) ? ((i * 13) % Math.max(1, inset)) : (H - inset + ((i * 17) % Math.max(1, inset)));
      ctx.beginPath();
      ctx.ellipse(lx, ly, 6, 3, i * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    for (i = 0; i < 24; i++) {
      ly = (i * 37) % H;
      lx = (i % 2 === 0) ? ((i * 11) % Math.max(1, inset)) : (W - inset + ((i * 19) % Math.max(1, inset)));
      ctx.beginPath();
      ctx.ellipse(lx, ly, 3, 6, i * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // cucumbers + tomatoes along the rim (more as it closes = denser salad)
    s = Math.max(0.7, Math.min(1.4, inset / 50));
    var dens = state.saladClosing ? 14 : 10;
    for (i = 0; i < dens; i++) {
      // top / bottom rows
      lx = 20 + (i + 0.5) * ((W - 40) / dens);
      ly = Math.max(8, inset * (0.35 + (i % 3) * 0.15));
      if (i % 2 === 0) drawTomato(lx, ly, s);
      else drawCucumber(lx, ly, 0.15 * ((i % 5) - 2), s);
      ly = H - Math.max(8, inset * (0.35 + ((i + 1) % 3) * 0.15));
      if (i % 2 === 1) drawTomato(lx, ly, s);
      else drawCucumber(lx, ly, -0.2 * ((i % 4) - 1.5), s);
    }
    dens = state.saladClosing ? 10 : 7;
    for (i = 0; i < dens; i++) {
      // left / right columns
      ly = 30 + (i + 0.5) * ((H - 60) / dens);
      lx = Math.max(8, inset * (0.35 + (i % 3) * 0.15));
      if (i % 2 === 0) drawCucumber(lx, ly, Math.PI / 2 + 0.1, s);
      else drawTomato(lx, ly, s);
      lx = W - Math.max(8, inset * (0.35 + ((i + 2) % 3) * 0.15));
      if (i % 2 === 1) drawCucumber(lx, ly, Math.PI / 2 - 0.1, s);
      else drawTomato(lx, ly, s);
    }

    ctx.fillStyle = '#c8f080';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    if (state.saladClosing) {
      ctx.fillStyle = '#ffe08a';
      ctx.fillText("I don't even like salad", W / 2, Math.max(14, Math.min(inset * 0.55, 28)));
    } else {
      ctx.fillText('LEAFY GREEN SALAD', W / 2, Math.max(12, inset * 0.55));
    }
    ctx.textAlign = 'left';
  }

  function drawBelchRoom() {
    ctx.fillStyle = '#0c1828';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '14px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var rows = 8, cols = 3;
    var i, j, x, y, wave;
    for (j = 0; j < rows; j++) {
      for (i = 0; i < cols; i++) {
        x = (i + 0.5) * (W / cols);
        y = 36 + j * ((H - 40) / rows);
        wave = Math.sin((state.player.x + state.player.y) * 0.01 + i + j) * 0.15 + 0.55;
        ctx.fillStyle = 'rgba(120, 180, 255,' + wave + ')';
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(((i + j) % 2 ? -1 : 1) * 0.12);
        ctx.fillText('BELCHERTOWN', 0, 0);
        ctx.restore();
      }
    }
    var g = ctx.createRadialGradient(state.player.x, state.player.y, 40, state.player.x, state.player.y, 280);
    g.addColorStop(0, 'rgba(12, 24, 40, 0)');
    g.addColorStop(1, 'rgba(4, 8, 16, 0.45)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    drawSaladBorder();
    for (i = 0; i < state.belchItems.length; i++) drawBelchItem(state.belchItems[i]);
    ctx.fillStyle = '#9ec8ff';
    ctx.font = '8px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    if (state.saladClosing) {
      ctx.fillStyle = '#ffe08a';
      ctx.fillText("I don't even like salad", W / 2, 22);
    } else {
      ctx.fillText('PICK UP THE LOOT (−5 EACH)', W / 2, 22);
    }
    ctx.textAlign = 'left';
  }

  function drawNugget(n) {
    if (n.eaten) return;
    ctx.fillStyle = '#c47a28';
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, n.r, n.r * 0.75, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8b060';
    ctx.beginPath();
    ctx.ellipse(n.x - 2, n.y - 2, n.r * 0.45, n.r * 0.35, 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    var p = state.player;
    var s = state.size;
    var bodyH = 28 * s;
    var bodyW = 14 * s;
    var headY = p.y - bodyH * 0.55;
    ctx.fillStyle = state.salad > 0 ? '#8fbf6a' : '#e8b4c8';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y - bodyH * 0.15, bodyW * 0.55, bodyH * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(p.x, headY, bodyW * 0.65, bodyW * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(p.x - bodyW * 0.45, p.y + bodyH * 0.25, bodyW * 0.5, bodyW * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(p.x + bodyW * 0.45, p.y + bodyH * 0.25, bodyW * 0.5, bodyW * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0610';
    ctx.beginPath();
    ctx.arc(p.x - 3 * s, headY - bodyW * 0.08, Math.max(1.2, 1.5 * s), 0, Math.PI * 2);
    ctx.arc(p.x + 3 * s, headY - bodyW * 0.08, Math.max(1.2, 1.5 * s), 0, Math.PI * 2);
    ctx.fill();

    // Mouth: toothy grin that grows with nugs; max frown in Belchertown.
    var mouthY = headY + bodyW * 0.18;
    var grow = Math.min(1, Math.max(0, state.nugsSinceShrink / 15));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (state.belchertown || state.scene === 'belch') {
      ctx.strokeStyle = '#1a0610';
      ctx.lineWidth = Math.max(2, 1.8 * s);
      ctx.beginPath();
      var frownR = Math.max(4, 7 * s);
      ctx.arc(p.x, mouthY + frownR * 0.7, frownR, Math.PI * 1.15, Math.PI * 1.85, false);
      ctx.stroke();
    } else {
      // Wide open smile clipped to head — white teeth make the grin obvious.
      var halfW = (3.2 + grow * 5.5) * s;
      var openH = (1.6 + grow * 4.2) * s;
      var topY = mouthY - openH * 0.15;
      var botY = mouthY + openH;

      // Dark mouth cavity
      ctx.fillStyle = '#2a0814';
      ctx.beginPath();
      ctx.moveTo(p.x - halfW, topY);
      ctx.quadraticCurveTo(p.x, topY - openH * 0.15, p.x + halfW, topY);
      ctx.quadraticCurveTo(p.x, botY + openH * 0.35, p.x - halfW, topY);
      ctx.closePath();
      ctx.fill();

      // White teeth band across the top of the smile
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p.x - halfW, topY);
      ctx.quadraticCurveTo(p.x, topY - openH * 0.15, p.x + halfW, topY);
      ctx.quadraticCurveTo(p.x, botY + openH * 0.35, p.x - halfW, topY);
      ctx.closePath();
      ctx.clip();
      var toothH = Math.max(2, openH * 0.42);
      ctx.fillStyle = '#fff8f0';
      ctx.fillRect(p.x - halfW, topY - 1, halfW * 2, toothH);
      // Tooth gaps
      ctx.strokeStyle = '#2a0814';
      ctx.lineWidth = Math.max(1, 0.7 * s);
      var teeth = 3 + Math.round(grow * 5);
      for (var ti = 1; ti < teeth; ti++) {
        var tx = p.x - halfW + (ti / teeth) * halfW * 2;
        ctx.beginPath();
        ctx.moveTo(tx, topY);
        ctx.lineTo(tx, topY + toothH);
        ctx.stroke();
      }
      ctx.restore();

      // Lip outline so it reads as a smile, not just a white bar
      ctx.strokeStyle = '#1a0610';
      ctx.lineWidth = Math.max(1.5, 1.3 * s);
      ctx.beginPath();
      ctx.moveTo(p.x - halfW, topY);
      ctx.quadraticCurveTo(p.x, topY - openH * 0.15, p.x + halfW, topY);
      ctx.quadraticCurveTo(p.x, botY + openH * 0.35, p.x - halfW, topY);
      ctx.closePath();
      ctx.stroke();
    }

    if (state.salad > 0) {
      ctx.fillStyle = '#c8f080';
      for (var i = 0; i < 8; i++) {
        var a = (i / 8) * Math.PI * 2 + state.salad * 0.05;
        var rr = bodyH * 0.7;
        ctx.fillRect(p.x + Math.cos(a) * rr - 2, p.y + Math.sin(a) * rr - 2, 4, 4);
      }
    }
  }

  function drawSaladBurst() {
    if (state.salad <= 0) return;
    var t = state.salad;
    ctx.fillStyle = 'rgba(140, 200, 80,' + (t / 90) + ')';
    for (var i = 0; i < 24; i++) {
      var a = (i / 24) * Math.PI * 2;
      var d = (90 - t) * 3 + (i % 5) * 8;
      ctx.fillRect(
        state.player.x + Math.cos(a) * d - 4,
        state.player.y + Math.sin(a) * d - 4,
        8, 6
      );
    }
    ctx.fillStyle = '#e8ffe0';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText("SALAD!!!!", W / 2, 70);
    ctx.textAlign = 'left';
  }

  function update() {
    if (state.salad > 0) state.salad--;

    applyWasdMove();

    var pr = playerRadius();

    if (state.scene === 'belch') {
      var i, it;
      if (!state.saladClosing) {
        for (i = 0; i < state.belchItems.length; i++) {
          it = state.belchItems[i];
          if (!it.eaten && dist(state.player.x, state.player.y, it.x, it.y) < pr + it.r) {
            eatBelchItem(it);
          }
        }
        // Soft wall: can't walk into the salad rim until it closes in
        var rim = state.saladInset + 4;
        state.player.x = Math.max(rim + pr, Math.min(W - rim - pr, state.player.x));
        state.player.y = Math.max(rim + pr, Math.min(H - rim - pr, state.player.y));
      } else {
        // ~3.5 seconds of salad crushing inward to center
        state.saladCloseT += 1 / 60;
        var t = Math.min(1, state.saladCloseT / 3.5);
        state.saladInset = 34 + t * (Math.min(W, H) * 0.42);
        // Push him toward the middle as the greens close
        state.player.x += (W / 2 - state.player.x) * (0.04 + t * 0.08);
        state.player.y += (H / 2 - state.player.y) * (0.04 + t * 0.08);
        var maxInset = Math.min(W, H) / 2 - 8;
        if (state.saladInset > maxInset) state.saladInset = maxInset;
        if (t >= 1) {
          finishBelchertownSalad();
        }
      }
      return;
    }

    for (var i = 0; i < state.nuggets.length; i++) {
      var n = state.nuggets[i];
      if (!n.eaten && dist(state.player.x, state.player.y, n.x, n.y) < pr + n.r) {
        eatNug(n);
      }
    }

    if (state.doorOpen) {
      var door = doorGeom();
      if (dist(state.player.x, state.player.y, door.cx, door.cy) < pr + door.r * 0.55) {
        if (!state.doorLatch) {
          state.doorLatch = true;
          tryDoor();
        }
      } else {
        state.doorLatch = false;
      }
    }

    if (state.belchertown) {
      var b = { x: 22, y: H / 2, r: 40 };
      if (dist(state.player.x, state.player.y, b.x, b.y) < pr + b.r * 0.5) {
        if (!state.belchLatch) {
          state.belchLatch = true;
          hitBelchertown();
        }
      } else {
        state.belchLatch = false;
      }
    }
  }

  function frame() {
    update();
    if (state.scene === 'belch') {
      drawBelchRoom();
      drawPlayer();
      drawSaladBurst();
    } else {
      drawAttic();
      for (var i = 0; i < state.nuggets.length; i++) drawNugget(state.nuggets[i]);
      drawDoor();
      drawBelchertown();
      drawPlayer();
      drawSaladBurst();
    }
    requestAnimationFrame(frame);
  }

  resetAll();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
